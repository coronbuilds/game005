<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>CAMERA HUNTER 2</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:manipulation;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#000;
}

/* カメラ */

#camera{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#111;
}

/* ゲームレイヤー */

#gameLayer{
  position:absolute;
  inset:0;
  overflow:hidden;
}

/* HUD */

#hud{
  position:absolute;
  z-index:50;
  top:0;
  left:0;
  right:0;

  padding:
    calc(env(safe-area-inset-top) + 10px)
    14px
    8px;

  display:flex;
  justify-content:space-between;

  color:white;

  text-shadow:
    0 2px 5px #000;

  pointer-events:none;
}

.hudLeft,
.hudRight{
  font-weight:900;
}

#score{
  font-size:26px;
}

#combo{
  font-size:16px;
  color:#ffe600;
}

#time{
  font-size:26px;
  text-align:right;
}

#lives{
  font-size:17px;
  text-align:right;
}

/* 照準 */

#crosshair{
  position:absolute;

  z-index:40;

  width:56px;
  height:56px;

  transform:
    translate(-50%,-50%);

  pointer-events:none;
}

#crosshair:before,
#crosshair:after{
  content:"";

  position:absolute;

  background:white;

  box-shadow:
    0 0 5px #000;
}

#crosshair:before{
  width:56px;
  height:2px;

  left:0;
  top:27px;
}

#crosshair:after{
  width:2px;
  height:56px;

  left:27px;
  top:0;
}

/* 敵 */

.enemy{
  position:absolute;

  width:74px;
  height:74px;

  transform:
    translate(-50%,-50%);

  z-index:20;

  touch-action:none;
}

.enemyBody{
  width:100%;
  height:100%;

  border-radius:50%;

  border:3px solid white;

  background:
    radial-gradient(
      circle at 35% 31%,
      white 0 5%,
      transparent 6%
    ),

    radial-gradient(
      circle at 65% 31%,
      white 0 5%,
      transparent 6%
    ),

    radial-gradient(
      circle at 35% 31%,
      #ff5555 0 14%,
      transparent 15%
    ),

    radial-gradient(
      circle at 65% 31%,
      #ff5555 0 14%,
      transparent 15%
    ),

    radial-gradient(
      circle at 50% 62%,
      #111 0 21%,
      transparent 22%
    ),

    linear-gradient(
      145deg,
      #ff3535,
      #760000
    );

  box-shadow:
    0 0 10px #ff2222,
    0 0 28px #ff0000;
}

.enemy:after{
  content:"";

  position:absolute;

  inset:-12px;

  border:
    2px solid
    rgba(255,255,255,.4);

  border-radius:50%;
}

/* ボス */

.enemy.boss{
  width:130px;
  height:130px;
}

.enemy.boss .enemyBody{
  border-width:5px;

  box-shadow:
    0 0 15px #ff2222,
    0 0 50px #ff0000;
}

/* ボスHP */

.hp{
  position:absolute;

  left:50%;
  top:-17px;

  transform:
    translateX(-50%);

  width:100%;
  height:8px;

  background:#111;

  border:
    1px solid white;

  border-radius:10px;

  overflow:hidden;
}

.hp i{
  display:block;

  height:100%;

  width:100%;

  background:#32ff4b;
}

/* 弾 */

.shot{
  position:absolute;

  z-index:45;

  width:8px;
  height:8px;

  border-radius:50%;

  background:white;

  box-shadow:
    0 0 12px 5px #ffe600;

  transform:
    translate(-50%,-50%);

  pointer-events:none;
}

/* ヒット文字 */

.hit{
  position:absolute;

  z-index:55;

  transform:
    translate(-50%,-50%);

  font-size:25px;

  font-weight:1000;

  color:white;

  text-shadow:
    0 0 8px #f00,
    0 2px 4px #000;

  pointer-events:none;

  animation:
    hitAnim .6s forwards;
}

/* 爆発 */

.explosion{
  position:absolute;

  z-index:54;

  width:20px;
  height:20px;

  border:
    4px solid white;

  border-radius:50%;

  transform:
    translate(-50%,-50%);

  pointer-events:none;

  animation:
    explosionAnim .42s forwards;
}

/* WAVE文字 */

#banner{
  position:absolute;

  z-index:60;

  left:50%;
  top:22%;

  transform:
    translate(-50%,-50%);

  color:white;

  font-size:32px;

  font-weight:1000;

  text-shadow:
    0 0 12px #000;

  opacity:0;

  pointer-events:none;

  white-space:nowrap;
}

/* メニュー */

.overlay{
  position:absolute;

  z-index:100;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:24px;

  text-align:center;

  color:white;

  background:
    linear-gradient(
      rgba(0,0,0,.72),
      rgba(0,0,0,.9)
    );
}

.panel{
  width:min(430px,92vw);
}

.logo{
  font-size:43px;

  line-height:.9;

  font-weight:1000;

  letter-spacing:-2px;
}

.sub{
  margin:
    14px 0 26px;

  color:#ddd;

  line-height:1.5;
}

button{
  width:100%;

  min-height:58px;

  border:0;

  border-radius:16px;

  background:#e00000;

  color:white;

  font-size:19px;

  font-weight:1000;

  box-shadow:
    0 6px 0 #780000;

  touch-action:manipulation;
}

button:active{
  transform:
    translateY(4px);

  box-shadow:
    0 2px 0 #780000;
}

button.secondary{
  margin-top:12px;

  background:#222;

  box-shadow:
    0 6px 0 #111;
}

.small{
  margin-top:18px;

  color:#aaa;

  font-size:13px;

  line-height:1.6;
}

.stat{
  font-size:52px;

  font-weight:1000;

  margin:15px 0;
}

.rank{
  color:#ffe600;

  font-size:18px;

  font-weight:900;

  margin-bottom:20px;
}

/* アニメーション */

@keyframes hitAnim{

  0%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(.7);
  }

  100%{
    opacity:0;

    transform:
      translate(-50%,-100px)
      scale(1.5);
  }

}

@keyframes explosionAnim{

  0%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(.2);
  }

  100%{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(5);

    border-color:#ff4a00;
  }

}

</style>
</head>


<body>

<div id="game">

  <!-- カメラ -->

  <video
    id="camera"
    autoplay
    muted
    playsinline>
  </video>


  <!-- ゲーム -->

  <div id="gameLayer"></div>


  <!-- HUD -->

  <div id="hud">

    <div class="hudLeft">

      SCORE

      <div id="score">
        0
      </div>

      <div id="combo">
        COMBO ×1
      </div>

    </div>


    <div class="hudRight">

      <div id="time">
        45
      </div>

      <div id="lives">
        ❤️❤️❤️
      </div>

    </div>

  </div>


  <!-- 照準 -->

  <div
    id="crosshair"
    style="left:50%;top:50%">
  </div>


  <!-- WAVE -->

  <div id="banner"></div>


  <!-- START -->

  <section
    id="start"
    class="overlay">

    <div class="panel">

      <div class="logo">
        CAMERA<br>
        HUNTER 2
      </div>

      <div class="sub">
        現実の景色に侵入した敵を撃ち落とせ。
      </div>

      <button id="startButton">
        📷 カメラを起動してSTART
      </button>

      <div class="small">
        カメラの使用許可が表示されたら
        「許可」を押してください。
        <br><br>
        45秒間で何体倒せる？
      </div>

    </div>

  </section>


  <!-- CAMERA ERROR -->

  <section
    id="cameraError"
    class="overlay"
    style="display:none">

    <div class="panel">

      <div class="logo">
        CAMERA ERROR
      </div>

      <div class="sub">
        カメラを利用できませんでした。
        <br><br>
        HTTPSのページで開いているか、
        Safariのカメラ設定を確認してください。
      </div>

      <button id="cameraRetry">
        もう一度試す
      </button>

    </div>

  </section>


  <!-- GAME OVER -->

  <section
    id="gameOver"
    class="overlay"
    style="display:none">

    <div class="panel">

      <div class="logo">
        GAME OVER
      </div>

      <div
        class="stat"
        id="finalScore">
        0
      </div>

      <div
        class="rank"
        id="rank">
        RANK C
      </div>

      <button id="retryButton">
        🔥 もう一度
      </button>

      <button
        id="stopButton"
        class="secondary">
        カメラを停止
      </button>

    </div>

  </section>

</div>


<script>

"use strict";


/* =========================
   DOM
========================= */

const camera =
  document.getElementById(
    "camera"
  );

const gameLayer =
  document.getElementById(
    "gameLayer"
  );

const start =
  document.getElementById(
    "start"
  );

const cameraError =
  document.getElementById(
    "cameraError"
  );

const gameOver =
  document.getElementById(
    "gameOver"
  );

const startButton =
  document.getElementById(
    "startButton"
  );

const cameraRetry =
  document.getElementById(
    "cameraRetry"
  );

const retryButton =
  document.getElementById(
    "retryButton"
  );

const stopButton =
  document.getElementById(
    "stopButton"
  );

const scoreElement =
  document.getElementById(
    "score"
  );

const comboElement =
  document.getElementById(
    "combo"
  );

const timeElement =
  document.getElementById(
    "time"
  );

const livesElement =
  document.getElementById(
    "lives"
  );

const finalScoreElement =
  document.getElementById(
    "finalScore"
  );

const rankElement =
  document.getElementById(
    "rank"
  );

const banner =
  document.getElementById(
    "banner"
  );

const crosshair =
  document.getElementById(
    "crosshair"
  );


/* =========================
   GAME STATE
========================= */

let stream = null;

let playing = false;

let score = 0;

let combo = 0;

let lives = 3;

let timeLeft = 45;

let elapsed = 0;

let enemyId = 0;

let spawnTimer = null;

let gameTimer = null;

let animationFrame = null;

let lastFrame = 0;

const enemies =
  new Map();


/* =========================
   HUD
========================= */

function updateHUD(){

  scoreElement.textContent =
    score.toLocaleString();

  comboElement.textContent =
    "COMBO ×" +
    Math.max(1,combo);

  timeElement.textContent =
    timeLeft;

  livesElement.textContent =
    "❤️".repeat(lives) +
    "🖤".repeat(
      3 - lives
    );

}


/* =========================
   CAMERA
========================= */

function stopCamera(){

  if(stream){

    stream
      .getTracks()
      .forEach(track =>
        track.stop()
      );

    stream = null;

  }

  camera.srcObject = null;

}


async function startCamera(){

  cameraError.style.display =
    "none";

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Camera API unavailable"
      );

    }


    stopCamera();


    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:"environment"
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }

          },

          audio:false

        });


    camera.srcObject =
      stream;


    await camera.play();


    return true;


  }catch(error){

    cameraError.style.display =
      "flex";

    return false;

  }

}


/* =========================
   RANDOM POSITION
========================= */

function randomPosition(){

  const width =
    window.innerWidth;

  const height =
    window.innerHeight;


  const marginX = 60;

  const top = 110;

  const bottom = 90;


  return{

    x:
      marginX +
      Math.random() *
      Math.max(
        1,
        width -
        marginX * 2
      ),

    y:
      top +
      Math.random() *
      Math.max(
        1,
        height -
        top -
        bottom
      )

  };

}


/* =========================
   DIFFICULTY
========================= */

function difficulty(){

  return 1 +
    Math.floor(
      elapsed / 7
    );

}


/* =========================
   CREATE ENEMY
========================= */

function createEnemy(
  forceBoss = false
){

  if(!playing)
    return;


  const d =
    difficulty();


  const boss =
    forceBoss ||
    (
      elapsed > 0 &&
      elapsed % 20 === 0 &&
      Math.random() < .3
    );


  const pos =
    randomPosition();


  const enemy =
    document.createElement(
      "div"
    );


  enemy.className =
    boss
      ? "enemy boss"
      : "enemy";


  enemy.style.left =
    pos.x + "px";


  enemy.style.top =
    pos.y + "px";


  enemy.dataset.x =
    pos.x;


  enemy.dataset.y =
    pos.y;


  const body =
    document.createElement(
      "div"
    );


  body.className =
    "enemyBody";


  enemy.appendChild(
    body
  );


  let hp =
    boss ? 3 : 1;


  if(boss){

    const hpBar =
      document.createElement(
        "div"
      );


    hpBar.className =
      "hp";


    const hpFill =
      document.createElement(
        "i"
      );


    hpBar.appendChild(
      hpFill
    );


    enemy.appendChild(
      hpBar
    );


    enemy.hpFill =
      hpFill;

  }


  const id =
    ++enemyId;


  enemy.dataset.id =
    id;


  gameLayer.appendChild(
    enemy
  );


  enemies.set(
    id,
    {

      element:enemy,

      x:pos.x,

      y:pos.y,

      hp:hp,

      boss:boss,

      vx:
        (
          Math.random() -
          .5
        ) *
        (d * 3),

      vy:
        (
          Math.random() -
          .5
        ) *
        (d * 2)

    }
  );


  enemy.addEventListener(
    "pointerdown",
    function(event){

      event.preventDefault();

      event.stopPropagation();

      shootEnemy(
        id,
        event.clientX,
        event.clientY
      );

    },
    {
      passive:false
    }
  );


  const lifetime =
    boss
      ? 5500
      : Math.max(
          800,
          2100 -
          d * 120
        );


  setTimeout(
    function(){

      if(
        enemies.has(id) &&
        playing
      ){

        missEnemy(id);

      }

    },
    lifetime
  );

}


/* =========================
   SHOOT ENEMY
========================= */

function shootEnemy(
  id,
  shotX,
  shotY
){

  if(!playing)
    return;


  const enemy =
    enemies.get(id);


  if(!enemy)
    return;


  createShot(
    shotX,
    shotY,
    enemy.x,
    enemy.y
  );


  enemy.hp--;


  if(
    enemy.boss &&
    enemy.hpFill
  ){

    enemy.hpFill.style.width =
      Math.max(
        0,
        enemy.hp / 3 * 100
      ) + "%";

  }


  if(enemy.hp > 0){

    combo++;

    score +=
      50 *
      Math.max(
        1,
        combo
      );


    showHit(
      enemy.x,
      enemy.y,
      "HIT!"
    );


    updateHUD();

    return;

  }


  const points =
    enemy.boss

      ? 1000 *
        Math.max(
          1,
          combo + 1
        )

      : 100 *
        Math.max(
          1,
          combo + 1
        );


  score +=
    points;


  combo++;


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      enemy.boss
        ? [40,25,70]
        : 20
    );

  }


  showHit(
    enemy.x,
    enemy.y,
    "+" + points
  );


  createExplosion(
    enemy.x,
    enemy.y,
    enemy.boss
      ? 110
      : 65
  );


  enemy.element.remove();


  enemies.delete(id);


  if(enemy.boss){

    showBanner(
      "BOSS DOWN!"
    );

  }


  updateHUD();

}


/* =========================
   MISS
========================= */

function missEnemy(id){

  const enemy =
    enemies.get(id);


  if(!enemy)
    return;


  enemy.element.remove();


  enemies.delete(id);


  lives--;

  combo = 0;


  if(
    navigator.vibrate
  ){

    navigator.vibrate(80);

  }


  updateHUD();


  if(lives <= 0){

    endGame();

  }

}


/* =========================
   SHOT
========================= */

function createShot(
  startX,
  startY,
  endX,
  endY
){

  const shot =
    document.createElement(
      "div"
    );


  shot.className =
    "shot";


  shot.style.left =
    startX + "px";


  shot.style.top =
    startY + "px";


  gameLayer.appendChild(
    shot
  );


  requestAnimationFrame(
    function(){

      shot.style.transition =
        "left .12s linear," +
        "top .12s linear";


      shot.style.left =
        endX + "px";


      shot.style.top =
        endY + "px";

    }
  );


  setTimeout(
    function(){

      shot.remove();

    },
    150
  );

}


/* =========================
   HIT
========================= */

function showHit(
  x,
  y,
  text
){

  const hit =
    document.createElement(
      "div"
    );


  hit.className =
    "hit";


  hit.textContent =
    text;


  hit.style.left =
    x + "px";


  hit.style.top =
    y + "px";


  gameLayer.appendChild(
    hit
  );


  setTimeout(
    function(){

      hit.remove();

    },
    650
  );

}


/* =========================
   EXPLOSION
========================= */

function createExplosion(
  x,
  y,
  size
){

  const explosion =
    document.createElement(
      "div"
    );


  explosion.className =
    "explosion";


  explosion.style.width =
    size + "px";


  explosion.style.height =
    size + "px";


  explosion.style.left =
    x + "px";


  explosion.style.top =
    y + "px";


  gameLayer.appendChild(
    explosion
  );


  setTimeout(
    function(){

      explosion.remove();

    },
    450
  );

}


/* =========================
   BANNER
========================= */

let bannerTimer = null;


function showBanner(
  text
){

  banner.textContent =
    text;


  banner.style.opacity =
    "1";


  clearTimeout(
    bannerTimer
  );


  bannerTimer =
    setTimeout(
      function(){

        banner.style.opacity =
          "0";

      },
      900
    );

}


/* =========================
   GAME LOOP
========================= */

function gameLoop(
  timestamp
){

  if(!playing)
    return;


  const delta =
    Math.min(
      .04,
      (
        timestamp -
        lastFrame
      ) / 1000 || 0
    );


  lastFrame =
    timestamp;


  enemies.forEach(
    function(enemy){

      enemy.x +=
        enemy.vx *
        delta;


      enemy.y +=
        enemy.vy *
        delta;


      const margin =
        enemy.boss
          ? 75
          : 45;


      if(
        enemy.x < margin ||
        enemy.x >
        window.innerWidth -
        margin
      ){

        enemy.vx *= -1;

      }


      if(
        enemy.y < 110 ||
        enemy.y >
        window.innerHeight -
        90
      ){

        enemy.vy *= -1;

      }


      enemy.element.style.left =
        enemy.x + "px";


      enemy.element.style.top =
        enemy.y + "px";


      enemy.element.dataset.x =
        enemy.x;


      enemy.element.dataset.y =
        enemy.y;

    }
  );


  animationFrame =
    requestAnimationFrame(
      gameLoop
    );

}


/* =========================
   PLAYER SHOOT
========================= */

function playerShoot(
  x,
  y
){

  if(!playing)
    return;


  let target = null;

  let nearest =
    Infinity;


  enemies.forEach(
    function(enemy,id){

      const radius =
        enemy.boss
          ? 90
          : 62;


      const distance =
        Math.hypot(
          enemy.x - x,
          enemy.y - y
        );


      if(
        distance < radius &&
        distance < nearest
      ){

        nearest =
          distance;

        target =
          id;

      }

    }
  );


  if(target !== null){

    shootEnemy(
      target,
      x,
      y
    );

  }else{

    combo = 0;

    showHit(
      x,
      y,
      "MISS"
    );

    updateHUD();

  }

}


/* =========================
   TOUCH
========================= */

gameLayer.addEventListener(
  "pointerdown",
  function(event){

    if(!playing)
      return;


    playerShoot(
      event.clientX,
      event.clientY
    );

  },
  {
    passive:false
  }
);


/* =========================
   CROSSHAIR
========================= */

document.addEventListener(
  "pointermove",
  function(event){

    if(!playing)
      return;


    crosshair.style.left =
      event.clientX + "px";


    crosshair.style.top =
      event.clientY + "px";

  },
  {
    passive:true
  }
);


/* =========================
   START
========================= */

function startGame(){

  clearInterval(
    spawnTimer
  );

  clearInterval(
    gameTimer
  );


  cancelAnimationFrame(
    animationFrame
  );


  enemies.forEach(
    enemy =>
      enemy.element.remove()
  );


  enemies.clear();


  score = 0;

  combo = 0;

  lives = 3;

  timeLeft = 45;

  elapsed = 0;


  playing = true;


  start.style.display =
    "none";


  gameOver.style.display =
    "none";


  cameraError.style.display =
    "none";


  updateHUD();


  createEnemy();

  createEnemy();


  spawnTimer =
    setInterval(
      function(){

        if(!playing)
          return;


        createEnemy();


        if(
          difficulty() >= 4 &&
          Math.random() < .35
        ){

          createEnemy();

        }


        if(
          timeLeft === 30 ||
          timeLeft === 15
        ){

          createEnemy(true);

        }

      },
      850
    );


  gameTimer =
    setInterval(
      function(){

        if(!playing)
          return;


        timeLeft--;

        elapsed++;


        if(timeLeft === 30){

          showBanner(
            "WAVE 2"
          );

        }


        if(timeLeft === 15){

          showBanner(
            "FINAL WAVE"
          );

        }


        updateHUD();


        if(
          timeLeft <= 0
        ){

          endGame();

        }

      },
      1000
    );


  lastFrame =
    performance.now();


  animationFrame =
    requestAnimationFrame(
      gameLoop
    );

}


/* =========================
   END GAME
========================= */

function getRank(
  score
){

  if(score >= 12000)
    return "RANK S";

  if(score >= 8000)
    return "RANK A";

  if(score >= 5000)
    return "RANK B";

  return "RANK C";

}


function endGame(){

  if(!playing)
    return;


  playing = false;


  clearInterval(
    spawnTimer
  );


  clearInterval(
    gameTimer
  );


  cancelAnimationFrame(
    animationFrame
  );


  spawnTimer = null;

  gameTimer = null;


  enemies.forEach(
    enemy =>
      enemy.element.remove()
  );


  enemies.clear();


  finalScoreElement.textContent =
    score.toLocaleString();


  rankElement.textContent =
    getRank(score);


  gameOver.style.display =
    "flex";

}


/* =========================
   BUTTONS
========================= */

startButton.addEventListener(
  "click",
  async function(){

    startButton.disabled =
      true;


    const cameraOK =
      await startCamera();


    startButton.disabled =
      false;


    if(cameraOK){

      startGame();

    }

  }
);


cameraRetry.addEventListener(
  "click",
  async function(){

    const cameraOK =
      await startCamera();


    if(cameraOK){

      startGame();

    }

  }
);


retryButton.addEventListener(
  "click",
  async function(){

    if(!stream){

      const cameraOK =
        await startCamera();


      if(!cameraOK)
        return;

    }


    startGame();

  }
);


stopButton.addEventListener(
  "click",
  function(){

    endGame();

    stopCamera();


    gameOver.style.display =
      "none";


    start.style.display =
      "flex";

  }
);


/* =========================
   INIT
========================= */

updateHUD();

</script>
