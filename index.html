<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">

<title>Camera Aim Test</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
}

#camera{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

#info{
  position:absolute;
  z-index:20;
  top:calc(env(safe-area-inset-top) + 10px);
  left:10px;
  right:10px;
  color:white;
  font-size:15px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#heading{
  font-size:25px;
  margin-top:5px;
}

#instruction{
  margin-top:8px;
  color:#ffe600;
}

#crosshair{
  position:absolute;
  z-index:30;
  left:50%;
  top:50%;
  width:100px;
  height:100px;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

#crosshair:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:49px;
  height:2px;
  background:white;
}

#crosshair:after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:49px;
  width:2px;
  background:white;
}

#circle{
  position:absolute;
  inset:12px;
  border:3px solid white;
  border-radius:50%;
}

#enemy{
  position:absolute;
  z-index:25;

  left:50%;
  top:50%;

  width:90px;
  height:90px;

  transform:
    translate(-50%,-50%);

  border:4px solid white;
  border-radius:50%;

  background:
    radial-gradient(
      circle at 32% 35%,
      white 0 5%,
      transparent 6%
    ),
    radial-gradient(
      circle at 68% 35%,
      white 0 5%,
      transparent 6%
    ),
    radial-gradient(
      circle at 32% 35%,
      red 0 14%,
      transparent 15%
    ),
    radial-gradient(
      circle at 68% 35%,
      red 0 14%,
      transparent 15%
    ),
    radial-gradient(
      circle at 50% 68%,
      #111 0 18%,
      transparent 19%
    ),
    #d00000;

  box-shadow:
    0 0 20px red,
    0 0 45px red;

  pointer-events:none;
}

#start{
  position:absolute;
  z-index:100;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.85);
}

#start button{
  width:280px;
  height:70px;

  border:0;
  border-radius:18px;

  background:#e00000;
  color:white;

  font-size:21px;
  font-weight:900;
}

#status{
  position:absolute;
  z-index:50;

  left:50%;
  bottom:30px;

  transform:translateX(-50%);

  color:white;

  background:rgba(0,0,0,.65);

  padding:12px 18px;

  border-radius:12px;

  font-weight:bold;

  white-space:nowrap;
}
</style>
</head>

<body>

<div id="game">

  <video
    id="camera"
    autoplay
    muted
    playsinline>
  </video>

  <div id="info">

    CAMERA AIM TEST

    <div id="heading">
      方位：---
    </div>

    <div id="instruction">
      スマホをゆっくり右へ90°回してください
    </div>

  </div>

  <div id="crosshair">
    <div id="circle"></div>
  </div>

  <div id="enemy"></div>

  <div id="status">
    STARTを押してください
  </div>

  <div id="start">
    <button id="startButton">
      📷 START
    </button>
  </div>

</div>


<script>

"use strict";


const camera =
  document.getElementById("camera");

const enemy =
  document.getElementById("enemy");

const headingText =
  document.getElementById("heading");

const status =
  document.getElementById("status");

const start =
  document.getElementById("start");

const startButton =
  document.getElementById("startButton");


/*
========================================
 カメラ
========================================
*/

let stream = null;

async function startCamera(){

  try{

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:"environment"
            }
          },

          audio:false

        });

    camera.srcObject =
      stream;

    await camera.play();

    return true;

  }catch(e){

    status.textContent =
      "カメラを許可してください";

    return false;

  }

}


/*
========================================
 コンパス
========================================
*/

let heading = null;


/*
 iPhone Safariでは
 webkitCompassHeadingを最優先
*/

function orientation(e){

  let h = null;


  if(
    typeof e.webkitCompassHeading ===
    "number" &&
    e.webkitCompassHeading !== 0
  ){

    h =
      e.webkitCompassHeading;

  }
  else if(
    typeof e.alpha === "number"
  ){

    h =
      e.alpha;

  }


  if(h === null){
    return;
  }


  heading =
    normalize(h);


  headingText.textContent =
    "方位：" +
    heading.toFixed(1) +
    "°";

}


function normalize(v){

  v =
    v % 360;

  if(v < 0){
    v += 360;
  }

  return v;

}


/*
========================================
 センサー開始
========================================
*/

async function startSensor(){

  if(
    typeof DeviceOrientationEvent ===
    "undefined"
  ){

    status.textContent =
      "この端末ではセンサーが使えません";

    return false;

  }


  if(
    typeof DeviceOrientationEvent
      .requestPermission ===
    "function"
  ){

    try{

      const result =
        await DeviceOrientationEvent
          .requestPermission();

      if(result !== "granted"){

        status.textContent =
          "モーションセンサーを許可してください";

        return false;

      }

    }catch(e){

      status.textContent =
        "センサー許可に失敗しました";

      return false;

    }

  }


  window.addEventListener(
    "deviceorientation",
    orientation,
    true
  );


  /*
   * iOSによっては
   * absoluteイベントの方が
   * 方位を取りやすい
   */

  window.addEventListener(
    "deviceorientationabsolute",
    orientation,
    true
  );


  return true;

}


/*
========================================
 敵の絶対位置
========================================

 ★ここが超重要★

 敵は「東」に固定する。

 スマホをどこへ向けても
 enemyHeading は変わらない。
*/

const enemyHeading = 90;


/*
========================================
 敵を画面に表示
========================================
*/

function updateEnemy(){

  if(heading === null){

    return;

  }


  /*
   * 敵の絶対方位
   * -
   * 現在のスマホの方位
   */

  let diff =
    enemyHeading -
    heading;


  /*
   * -180 ～ +180
   */

  while(diff > 180){
    diff -= 360;
  }

  while(diff < -180){
    diff += 360;
  }


  /*
   * 水平方向の視野角。
   *
   * 70°を画面いっぱいとする。
   */

  const fov = 70;


  const screenWidth =
    window.innerWidth;


  const center =
    screenWidth / 2;


  /*
   * ★重要★

   * diff が + なら右
   * diff が - なら左
   */

  const x =
    center +
    (
      diff / fov
    ) *
    screenWidth;


  enemy.style.left =
    x + "px";


  /*
   * デバッグ表示
   */

  status.textContent =
    "敵の方位 90° / 現在 " +
    heading.toFixed(1) +
    "° / 差 " +
    diff.toFixed(1) +
    "°";

}


/*
========================================
 START
========================================
*/

startButton.addEventListener(
  "click",
  async function(){

    startButton.disabled =
      true;


    status.textContent =
      "センサーを起動中…";


    const sensor =
      await startSensor();


    const cam =
      await startCamera();


    if(
      !sensor ||
      !cam
    ){

      startButton.disabled =
        false;

      return;

    }


    /*
     * センサー値が入るまで少し待つ
     */

    let count = 0;

    while(
      heading === null &&
      count < 30
    ){

      await new Promise(
        r =>
          setTimeout(r,100)
      );

      count++;

    }


    if(heading === null){

      status.textContent =
        "方位を取得できませんでした";

      startButton.disabled =
        false;

      return;

    }


    start.classList.add(
      "hidden"
    );


    status.textContent =
      "敵を探してください";


    requestAnimationFrame(
      loop
    );

  }
);


/*
========================================
 LOOP
========================================
*/

function loop(){

  updateEnemy();

  requestAnimationFrame(
    loop
  );

}


/*
========================================
 画面操作防止
========================================
*/

document.addEventListener(
  "dblclick",
  e => e.preventDefault(),
  {
    passive:false
  }
);

document.addEventListener(
  "gesturestart",
  e => e.preventDefault(),
  {
    passive:false
  }
);

document.addEventListener(
  "gesturechange",
  e => e.preventDefault(),
  {
    passive:false
  }
);

document.addEventListener(
  "gestureend",
  e => e.preventDefault(),
  {
    passive:false
  }
);

</script>

</body>
</html>
