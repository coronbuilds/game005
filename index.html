<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>CAMERA HUNTER</title>

<style>

*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#000;
}

#camera{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  pointer-events:none;
}

/* ====================
   GAME FIELD
==================== */

#field{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

/* ====================
   HUD
==================== */

#hud{
  position:absolute;
  z-index:50;

  top:0;
  left:0;
  right:0;

  padding:
    calc(env(safe-area-inset-top) + 12px)
    14px
    10px;

  display:flex;
  justify-content:space-between;

  color:white;

  text-shadow:
    0 2px 5px #000;

  pointer-events:none;
}

#score{
  font-size:27px;
  font-weight:1000;
}

#combo{
  color:#ffe600;
  font-size:16px;
  font-weight:1000;
}

#time{
  font-size:27px;
  font-weight:1000;
  text-align:right;
}

#lives{
  text-align:right;
  font-size:17px;
}

/* ====================
   AIM
==================== */

#aim{
  position:absolute;

  z-index:80;

  left:50%;
  top:50%;

  width:90px;
  height:90px;

  transform:
    translate(-50%,-50%);

  pointer-events:none;
}

.aimCircle{
  position:absolute;

  inset:12px;

  border:
    3px solid rgba(255,255,255,.95);

  border-radius:50%;

  box-shadow:
    0 0 8px #000;
}

.aimLine1,
.aimLine2{
  position:absolute;

  background:#fff;

  box-shadow:
    0 0 5px #000;
}

.aimLine1{
  width:90px;
  height:2px;

  top:44px;
  left:0;
}

.aimLine2{
  width:2px;
  height:90px;

  left:44px;
  top:0;
}

#aimDot{
  position:absolute;

  left:50%;
  top:50%;

  width:7px;
  height:7px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:#ff2020;

  box-shadow:
    0 0 8px #ff0000;
}

/* ====================
   ENEMY
==================== */

.enemy{
  position:absolute;

  left:0;
  top:0;

  width:78px;
  height:78px;

  transform:
    translate(-50%,-50%);

  pointer-events:none;
}

.enemyBody{
  width:100%;
  height:100%;

  border-radius:50%;

  border:
    3px solid white;

  background:
    radial-gradient(
      circle at 35% 32%,
      white 0 5%,
      transparent 6%
    ),
    radial-gradient(
      circle at 65% 32%,
      white 0 5%,
      transparent 6%
    ),
    radial-gradient(
      circle at 35% 32%,
      red 0 14%,
      transparent 15%
    ),
    radial-gradient(
      circle at 65% 32%,
      red 0 14%,
      transparent 15%
    ),
    radial-gradient(
      circle at 50% 65%,
      #111 0 20%,
      transparent 21%
    ),
    linear-gradient(
      145deg,
      #ff3434,
      #650000
    );

  box-shadow:
    0 0 15px red,
    0 0 35px red;
}

.enemy.boss{
  width:140px;
  height:140px;
}

.enemy.boss .enemyBody{
  border-width:5px;

  box-shadow:
    0 0 20px red,
    0 0 60px red;
}

/* HP */

.hp{
  position:absolute;

  left:50%;
  top:-14px;

  width:100%;
  height:8px;

  transform:
    translateX(-50%);

  background:#111;

  border:1px solid white;

  border-radius:10px;

  overflow:hidden;
}

.hp i{
  display:block;

  width:100%;
  height:100%;

  background:#39ff50;
}

/* ====================
   ATTACK BUTTON
==================== */

#attack{
  position:absolute;

  z-index:100;

  left:50%;
  bottom:
    calc(env(safe-area-inset-bottom) + 22px);

  transform:
    translateX(-50%);

  width:190px;
  height:72px;

  border-radius:38px;

  border:
    3px solid white;

  background:
    linear-gradient(
      #ff3030,
      #a90000
    );

  color:white;

  font-size:25px;

  font-weight:1000;

  letter-spacing:2px;

  box-shadow:
    0 6px 0 #500000,
    0 0 25px rgba(255,0,0,.7);

  touch-action:manipulation;
}

#attack:active{
  transform:
    translateX(-50%)
    translateY(5px);

  box-shadow:
    0 1px 0 #500000;
}

/* ====================
   MUZZLE
==================== */

#muzzle{
  position:absolute;

  z-index:90;

  left:50%;
  top:50%;

  width:30px;
  height:30px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 0 20px 12px #ffe600;

  opacity:0;

  pointer-events:none;
}

#muzzle.fire{
  animation:
    muzzle .15s forwards;
}

@keyframes muzzle{

  0%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(.4);
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(3);
  }

}

/* ====================
   HIT
==================== */

.hit{
  position:absolute;

  z-index:120;

  transform:
    translate(-50%,-50%);

  color:white;

  font-size:27px;

  font-weight:1000;

  text-shadow:
    0 0 10px red,
    0 2px 5px black;

  pointer-events:none;

  animation:
    hit .6s forwards;
}

@keyframes hit{

  from{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(.7);
  }

  to{
    opacity:0;

    transform:
      translate(-50%,-100px)
      scale(1.4);
  }

}

/* ====================
   EXPLOSION
==================== */

.explosion{
  position:absolute;

  z-index:110;

  border:
    4px solid white;

  border-radius:50%;

  transform:
    translate(-50%,-50%);

  pointer-events:none;

  animation:
    explosion .45s forwards;
}

@keyframes explosion{

  from{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale:.2;
  }

  to{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale:4;
  }

}

/* ====================
   BANNER
==================== */

#banner{
  position:absolute;

  z-index:150;

  top:25%;
  left:50%;

  transform:
    translate(-50%,-50%);

  color:white;

  font-size:36px;

  font-weight:1000;

  white-space:nowrap;

  text-shadow:
    0 0 15px #000;

  opacity:0;

  pointer-events:none;
}

/* ====================
   OVERLAY
==================== */

.overlay{
  position:absolute;

  z-index:200;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:25px;

  color:white;

  text-align:center;

  background:
    linear-gradient(
      rgba(0,0,0,.75),
      rgba(0,0,0,.93)
    );
}

.panel{
  width:min(430px,92vw);
}

.logo{
  font-size:43px;

  line-height:.88;

  font-weight:1000;

  letter-spacing:-2px;
}

.sub{
  margin:
    18px 0 25px;

  color:#ddd;

  line-height:1.6;
}

button{
  border:0;

  touch-action:manipulation;
}

#startButton,
#retryButton,
#cameraRetry{
  width:100%;
  min-height:60px;

  border-radius:16px;

  background:#e00000;

  color:white;

  font-size:19px;

  font-weight:1000;

  box-shadow:
    0 6px 0 #650000;
}

#startButton:active,
#retryButton:active,
#cameraRetry:active{
  transform:
    translateY(4px);

  box-shadow:
    0 2px 0 #650000;
}

.secondary{
  margin-top:12px;

  width:100%;
  min-height:55px;

  border-radius:16px;

  background:#222;

  color:white;

  font-size:17px;

  font-weight:900;
}

.finalScore{
  margin:15px 0;

  font-size:55px;

  font-weight:1000;
}

.rank{
  margin-bottom:20px;

  color:#ffe600;

  font-size:21px;

  font-weight:1000;
}

.small{
  margin-top:18px;

  color:#aaa;

  font-size:13px;

  line-height:1.6;
}

</style>
</head>

<body>

<div id="game">

  <video
    id="camera"
    autoplay
    muted
    playsinline>
  </video>

  <div id="field"></div>

  <div id="hud">

    <div>
      <div>SCORE</div>

      <div id="score">
        0
      </div>

      <div id="combo">
        COMBO ×1
      </div>
    </div>

    <div>

      <div id="time">
        60
      </div>

      <div id="lives">
        ❤️❤️❤️
      </div>

    </div>

  </div>

  <!-- 固定照準 -->

  <div id="aim">

    <div class="aimCircle"></div>

    <div class="aimLine1"></div>

    <div class="aimLine2"></div>

    <div id="aimDot"></div>

  </div>

  <div id="muzzle"></div>

  <div id="banner"></div>

  <!-- 攻撃ボタン -->

  <button id="attack">
    🔫 ATTACK
  </button>


  <!-- START -->

  <section
    id="start"
    class="overlay">

    <div class="panel">

      <div class="logo">
        CAMERA<br>
        HUNTER
      </div>

      <div class="sub">

        📱 スマホを動かして敵を探せ。<br>
        🎯 中央の照準に敵を入れろ。<br>
        🔫 ATTACKで撃て。

      </div>

      <button id="startButton">
        📷 カメラを起動
      </button>

      <div class="small">
        リアカメラを使用します。<br>
        カメラの許可が表示されたら「許可」。
      </div>

    </div>

  </section>


  <!-- CAMERA ERROR -->

  <section
    id="cameraError"
    class="overlay"
    style="display:none">

    <div class="panel">

      <div class="logo">
        CAMERA<br>
        ERROR
      </div>

      <div class="sub">
        カメラを起動できませんでした。
        <br><br>
        Safariのカメラ許可を確認してください。
      </div>

      <button id="cameraRetry">
        もう一度
      </button>

    </div>

  </section>


  <!-- GAME OVER -->

  <section
    id="gameOver"
    class="overlay"
    style="display:none">

    <div class="panel">

      <div class="logo">
        GAME OVER
      </div>

      <div
        id="finalScore"
        class="finalScore">
        0
      </div>

      <div
        id="rank"
        class="rank">
        RANK D
      </div>

      <button id="retryButton">
        🔥 もう一度
      </button>

      <button
        id="stopButton"
        class="secondary">
        カメラを停止
      </button>

    </div>

  </section>

</div>


<script>

"use strict";


/* =====================
   DOM
===================== */

const camera =
  document.getElementById(
    "camera"
  );

const field =
  document.getElementById(
    "field"
  );

const start =
  document.getElementById(
    "start"
  );

const cameraError =
  document.getElementById(
    "cameraError"
  );

const gameOver =
  document.getElementById(
    "gameOver"
  );

const startButton =
  document.getElementById(
    "startButton"
  );

const cameraRetry =
  document.getElementById(
    "cameraRetry"
  );

const retryButton =
  document.getElementById(
    "retryButton"
  );

const stopButton =
  document.getElementById(
    "stopButton"
  );

const attack =
  document.getElementById(
    "attack"
  );

const muzzle =
  document.getElementById(
    "muzzle"
  );

const scoreEl =
  document.getElementById(
    "score"
  );

const comboEl =
  document.getElementById(
    "combo"
  );

const timeEl =
  document.getElementById(
    "time"
  );

const livesEl =
  document.getElementById(
    "lives"
  );

const finalScoreEl =
  document.getElementById(
    "finalScore"
  );

const rankEl =
  document.getElementById(
    "rank"
  );

const banner =
  document.getElementById(
    "banner"
  );


/* =====================
   STATE
===================== */

let stream = null;

let playing = false;

let score = 0;

let combo = 0;

let lives = 3;

let time = 60;

let elapsed = 0;

let enemyId = 0;

let enemies = new Map();

let timer = null;

let spawner = null;


/* =====================
   CAMERA
===================== */

async function startCamera(){

  cameraError.style.display =
    "none";

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Camera unavailable"
      );

    }

    stopCamera();


    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:"environment"
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }

          },

          audio:false

        });


    camera.srcObject =
      stream;


    await camera.play();


    return true;

  }catch(error){

    cameraError.style.display =
      "flex";

    return false;

  }

}


function stopCamera(){

  if(!stream)
    return;


  stream
    .getTracks()
    .forEach(
      track =>
        track.stop()
    );


  stream = null;

  camera.srcObject = null;

}


/* =====================
   HUD
===================== */

function updateHUD(){

  scoreEl.textContent =
    score.toLocaleString();

  comboEl.textContent =
    "COMBO ×" +
    Math.max(
      1,
      combo
    );

  timeEl.textContent =
    time;

  livesEl.textContent =
    "❤️".repeat(lives) +
    "🖤".repeat(
      3 - lives
    );

}


/* =====================
   START GAME
===================== */

function startGame(){

  stopGameObjects();


  score = 0;

  combo = 0;

  lives = 3;

  time = 60;

  elapsed = 0;

  playing = true;


  start.style.display =
    "none";

  cameraError.style.display =
    "none";

  gameOver.style.display =
    "none";


  updateHUD();


  /*
   * 敵を最初から少し出す
   */

  createEnemy();

  createEnemy();


  /*
   * 敵追加
   */

  spawner =
    setInterval(
      () => {

        if(!playing)
          return;


        const amount =
          Math.min(
            3,
            1 +
            Math.floor(
              elapsed / 15
            )
          );


        for(
          let i=0;
          i<amount;
          i++
        ){

          setTimeout(
            createEnemy,
            i * 250
          );

        }

      },
      1300
    );


  /*
   * タイマー
   */

  timer =
    setInterval(
      () => {

        if(!playing)
          return;


        time--;

        elapsed++;


        if(time === 45){

          showBanner(
            "WAVE 2"
          );

        }


        if(time === 30){

          showBanner(
            "👑 BOSS"
          );

          createBoss();

        }


        if(time === 15){

          showBanner(
            "FINAL WAVE"
          );

        }


        updateHUD();


        if(time <= 0){

          endGame();

        }

      },
      1000
    );

}


/* =====================
   CREATE ENEMY
===================== */

function createEnemy(){

  if(!playing)
    return;


  if(enemies.size >= 10)
    return;


  const w =
    window.innerWidth;

  const h =
    window.innerHeight;


  /*
   * 画面の端に出現
   *
   * カメラを動かすと
   * その敵を画面中央に持ってくる
   */

  const side =
    Math.floor(
      Math.random() * 4
    );


  let x;
  let y;


  if(side === 0){

    x =
      50 +
      Math.random() *
      (w - 100);

    y = 130;

  }
  else if(side === 1){

    x = w - 40;

    y =
      150 +
      Math.random() *
      (h - 300);

  }
  else if(side === 2){

    x =
      50 +
      Math.random() *
      (w - 100);

    y = h - 130;

  }
  else{

    x = 40;

    y =
      150 +
      Math.random() *
      (h - 300);

  }


  const el =
    document.createElement(
      "div"
    );


  el.className =
    "enemy";


  const body =
    document.createElement(
      "div"
    );


  body.className =
    "enemyBody";


  el.appendChild(
    body
  );


  field.appendChild(
    el
  );


  const id =
    ++enemyId;


  const enemy = {

    id,

    element:el,

    x,

    y,

    life:
      1800 +
      Math.random() *
      1200,

    created:
      performance.now(),

    hp:1,

    boss:false

  };


  enemies.set(
    id,
    enemy
  );

}


/* =====================
   BOSS
===================== */

function createBoss(){

  const w =
    window.innerWidth;


  const el =
    document.createElement(
      "div"
    );


  el.className =
    "enemy boss";


  const body =
    document.createElement(
      "div"
    );


  body.className =
    "enemyBody";


  el.appendChild(
    body
  );


  const hp =
    document.createElement(
      "div"
    );


  hp.className =
    "hp";


  const hpFill =
    document.createElement(
      "i"
    );


  hp.appendChild(
    hpFill
  );

  el.appendChild(
    hp
  );


  field.appendChild(
    el
  );


  const id =
    ++enemyId;


  const enemy = {

    id,

    element:el,

    x:w / 2,

    y:150,

    life:7000,

    created:
      performance.now(),

    hp:5,

    boss:true,

    hpFill

  };


  enemies.set(
    id,
    enemy
  );

}


/* =====================
   FIND TARGET
===================== */

/*
 * ここが今回の重要部分。
 *
 * ATTACKを押した瞬間、
 * 画面中央に敵がいるか判定。
 */

function getTarget(){

  const cx =
    window.innerWidth / 2;

  const cy =
    window.innerHeight / 2;


  let target = null;

  let closest = Infinity;


  enemies.forEach(
    enemy => {

      const dx =
        enemy.x - cx;

      const dy =
        enemy.y - cy;

      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      /*
       * 中央の照準内
       */

      const allowed =
        enemy.boss
          ? 95
          : 65;


      if(
        distance <= allowed &&
        distance < closest
      ){

        closest =
          distance;

        target =
          enemy;

      }

    }
  );


  return target;

}


/* =====================
   ATTACK
===================== */

function fire(){

  if(!playing)
    return;


  /*
   * 銃口フラッシュ
   */

  muzzle.classList.remove(
    "fire"
  );

  void muzzle.offsetWidth;

  muzzle.classList.add(
    "fire"
  );


  /*
   * ターゲット取得
   */

  const target =
    getTarget();


  if(!target){

    /*
     * MISS
     */

    combo = 0;


    showHit(
      window.innerWidth / 2,
      window.innerHeight / 2,
      "MISS"
    );


    if(
      navigator.vibrate
    ){

      navigator.vibrate(20);

    }


    updateHUD();

    return;

  }


  /*
   * HIT
   */

  target.hp--;


  combo++;


  const multiplier =
    Math.min(
      10,
      Math.max(
        1,
        combo
      )
    );


  if(
    target.hp > 0
  ){

    score +=
      100 *
      multiplier;


    showHit(
      target.x,
      target.y,
      "HIT!"
    );


    updateBossHP(
      target
    );


    if(
      navigator.vibrate
    ){

      navigator.vibrate(30);

    }


    updateHUD();

    return;

  }


  /*
   * 撃破
   */

  const points =
    target.boss
      ? 2000 * multiplier
      : 150 * multiplier;


  score += points;


  showHit(
    target.x,
    target.y,
    "+" + points
  );


  explode(
    target.x,
    target.y,
    target.boss
      ? 150
      : 75
  );


  target.element.remove();


  enemies.delete(
    target.id
  );


  if(
    target.boss
  ){

    showBanner(
      "BOSS DOWN!"
    );

  }


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      target.boss
        ? [50,30,100]
        : 25
    );

  }


  updateHUD();

}


/* =====================
   BOSS HP
===================== */

function updateBossHP(
  enemy
){

  if(
    !enemy.boss ||
    !enemy.hpFill
  )
    return;


  enemy.hpFill.style.width =
    (
      enemy.hp / 5 * 100
    ) + "%";

}


/* =====================
   GAME LOOP
===================== */

function update(){

  if(!playing)
    return;


  const now =
    performance.now();


  enemies.forEach(
    enemy => {

      /*
       * 一定時間画面にいる
       * 敵を消す
       */

      if(
        now -
        enemy.created >
        enemy.life
      ){

        /*
         * 敵を逃した
         */

        enemy.element.remove();

        enemies.delete(
          enemy.id
        );


        lives--;

        combo = 0;


        updateHUD();


        if(lives <= 0){

          endGame();

        }

        return;

      }


      /*
       * 敵を少し上下左右に動かす
       * ただし「狙える範囲」
       */

      const t =
        (
          now -
          enemy.created
        ) / 1000;


      const radius =
        enemy.boss
          ? 55
          : 30;


      const centerX =
        enemy.x;


      const centerY =
        enemy.y;


      const px =
        centerX +
        Math.sin(
          t * 1.7
        ) *
        radius;


      const py =
        centerY +
        Math.cos(
          t * 1.4
        ) *
        radius;


      enemy.element.style.left =
        px + "px";


      enemy.element.style.top =
        py + "px";


      /*
       * 敵が見えている時間で
       * 少しずつ大きくする
       */

      const progress =
        Math.min(
          1,
          (
            now -
            enemy.created
          ) /
          enemy.life
        );


      const scale =
        .7 +
        progress *
        .8;


      enemy.element.style.transform =
        "translate(-50%,-50%) " +
        "scale(" +
        scale +
        ")";

    }
  );


  requestAnimationFrame(
    update
  );

}


/* =====================
   HIT TEXT
===================== */

function showHit(
  x,
  y,
  text
){

  const el =
    document.createElement(
      "div"
    );


  el.className =
    "hit";


  el.textContent =
    text;


  el.style.left =
    x + "px";


  el.style.top =
    y + "px";


  field.appendChild(
    el
  );


  setTimeout(
    () =>
      el.remove(),
    650
  );

}


/* =====================
   EXPLOSION
===================== */

function explode(
  x,
  y,
  size
){

  const el =
    document.createElement(
      "div"
    );


  el.className =
    "explosion";


  el.style.left =
    x + "px";


  el.style.top =
    y + "px";


  el.style.width =
    size + "px";


  el.style.height =
    size + "px";


  field.appendChild(
    el
  );


  setTimeout(
    () =>
      el.remove(),
    500
  );

}


/* =====================
   BANNER
===================== */

let bannerTimer;


function showBanner(
  text
){

  banner.textContent =
    text;


  banner.style.opacity =
    "1";


  clearTimeout(
    bannerTimer
  );


  bannerTimer =
    setTimeout(
      () => {

        banner.style.opacity =
          "0";

      },
      1000
    );

}


/* =====================
   END
===================== */

function endGame(){

  if(!playing)
    return;


  playing = false;


  stopGameObjects();


  finalScoreEl.textContent =
    score.toLocaleString();


  rankEl.textContent =
    getRank(score);


  gameOver.style.display =
    "flex";


  saveHighScore();

}


function stopGameObjects(){

  clearInterval(
    timer
  );

  clearInterval(
    spawner
  );


  timer = null;

  spawner = null;


  enemies.forEach(
    enemy =>
      enemy.element.remove()
  );


  enemies.clear();

}


/* =====================
   RANK
===================== */

function getRank(
  score
){

  if(score >= 20000)
    return "RANK S";

  if(score >= 12000)
    return "RANK A";

  if(score >= 7000)
    return "RANK B";

  if(score >= 3000)
    return "RANK C";

  return "RANK D";

}


/* =====================
   HIGH SCORE
===================== */

function saveHighScore(){

  const old =
    Number(
      localStorage.getItem(
        "cameraHunterBest"
      ) || 0
    );


  if(score > old){

    localStorage.setItem(
      "cameraHunterBest",
      score
    );

  }

}
