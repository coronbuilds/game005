<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>CAMERA HUNTER AR</title>

<style>

*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#000;
}

#camera{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  pointer-events:none;
}

#field{
  position:absolute;
  inset:0;
  pointer-events:none;
}

/* =========================
HUD
========================= */

#hud{
  position:absolute;
  z-index:50;
  top:0;
  left:0;
  right:0;

  padding:
    calc(env(safe-area-inset-top) + 12px)
    15px
    10px;

  display:flex;
  justify-content:space-between;

  color:#fff;
  text-shadow:0 2px 5px #000;

  pointer-events:none;
}

#score{
  font-size:27px;
  font-weight:1000;
}

#combo{
  color:#ffe600;
  font-size:15px;
  font-weight:1000;
}

#time{
  font-size:27px;
  font-weight:1000;
  text-align:right;
}

#lives{
  text-align:right;
}

/* =========================
照準
========================= */

#crosshair{
  position:absolute;
  z-index:80;

  left:50%;
  top:50%;

  width:105px;
  height:105px;

  transform:translate(-50%,-50%);

  pointer-events:none;
}

.ring{
  position:absolute;
  inset:14px;

  border:3px solid #fff;
  border-radius:50%;

  box-shadow:0 0 8px #000;
}

.lineH,
.lineV{
  position:absolute;
  background:#fff;
  box-shadow:0 0 5px #000;
}

.lineH{
  width:105px;
  height:2px;
  top:51px;
  left:0;
}

.lineV{
  width:2px;
  height:105px;
  left:51px;
  top:0;
}

.dot{
  position:absolute;

  left:50%;
  top:50%;

  width:7px;
  height:7px;

  transform:translate(-50%,-50%);

  background:red;
  border-radius:50%;

  box-shadow:0 0 8px red;
}

#crosshair.locked .ring{
  border-color:#ff2020;

  box-shadow:
    0 0 12px red,
    0 0 30px rgba(255,0,0,.8);
}

#crosshair.locked .lineH,
#crosshair.locked .lineV{
  background:#ff2020;
}

/* =========================
敵
========================= */

.enemy{
  position:absolute;

  width:76px;
  height:76px;

  transform:translate(-50%,-50%);

  pointer-events:none;
}

.enemyBody{
  width:100%;
  height:100%;

  border:3px solid #fff;
  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 32%,
      white 0 5%,
      transparent 6%
    ),
    radial-gradient(
      circle at 65% 32%,
      white 0 5%,
      transparent 6%
    ),
    radial-gradient(
      circle at 35% 32%,
      red 0 14%,
      transparent 15%
    ),
    radial-gradient(
      circle at 65% 32%,
      red 0 14%,
      transparent 15%
    ),
    radial-gradient(
      circle at 50% 67%,
      #111 0 20%,
      transparent 21%
    ),
    linear-gradient(
      145deg,
      #ff3030,
      #650000
    );

  box-shadow:
    0 0 15px red,
    0 0 35px red;
}

.enemy.boss{
  width:145px;
  height:145px;
}

.enemy.boss .enemyBody{
  border-width:5px;

  box-shadow:
    0 0 25px red,
    0 0 70px red;
}

.hp{
  position:absolute;

  left:50%;
  top:-15px;

  width:100%;
  height:8px;

  transform:translateX(-50%);

  background:#111;
  border:1px solid #fff;
  border-radius:10px;

  overflow:hidden;
}

.hp i{
  display:block;
  width:100%;
  height:100%;
  background:#35ff45;
}

/* =========================
ATTACK
========================= */

#attack{
  position:absolute;
  z-index:100;

  left:50%;

  bottom:
    calc(env(safe-area-inset-bottom) + 20px);

  transform:translateX(-50%);

  width:190px;
  height:72px;

  border:3px solid #fff;
  border-radius:40px;

  background:
    linear-gradient(
      #ff3434,
      #a50000
    );

  color:#fff;

  font-size:24px;
  font-weight:1000;

  letter-spacing:2px;

  box-shadow:
    0 6px 0 #500000,
    0 0 25px rgba(255,0,0,.7);

  touch-action:manipulation;
}

#attack:active{
  transform:
    translateX(-50%)
    translateY(5px);

  box-shadow:
    0 1px 0 #500000;
}

/* =========================
HIT
========================= */

.hit{
  position:absolute;
  z-index:120;

  transform:translate(-50%,-50%);

  color:#fff;

  font-size:28px;
  font-weight:1000;

  text-shadow:
    0 0 10px red,
    0 2px 5px #000;

  animation:hit .6s forwards;
}

@keyframes hit{

  from{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(.7);
  }

  to{
    opacity:0;

    transform:
      translate(-50%,-110px)
      scale(1.4);
  }

}

/* =========================
EXPLOSION
========================= */

.explosion{
  position:absolute;
  z-index:110;

  border:4px solid #fff;
  border-radius:50%;

  transform:translate(-50%,-50%);

  animation:
    explosion .45s forwards;
}

@keyframes explosion{

  from{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(.2);
  }

  to{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(4);
  }

}

/* =========================
BANNER
========================= */

#banner{
  position:absolute;

  z-index:150;

  top:27%;
  left:50%;

  transform:translate(-50%,-50%);

  color:#fff;

  font-size:38px;
  font-weight:1000;

  white-space:nowrap;

  text-shadow:0 0 15px #000;

  opacity:0;

  pointer-events:none;
}

/* =========================
OVERLAY
========================= */

.overlay{
  position:absolute;
  z-index:200;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:25px;

  color:#fff;
  text-align:center;

  background:
    linear-gradient(
      rgba(0,0,0,.78),
      rgba(0,0,0,.95)
    );
}

.panel{
  width:min(430px,92vw);
}

.logo{
  font-size:43px;
  line-height:.9;

  font-weight:1000;
  letter-spacing:-2px;
}

.sub{
  margin:20px 0 25px;

  color:#ddd;

  line-height:1.7;
}

.mainButton{
  width:100%;
  min-height:62px;

  border:0;
  border-radius:16px;

  background:#e00000;

  color:#fff;

  font-size:19px;
  font-weight:1000;

  box-shadow:
    0 6px 0 #650000;

  touch-action:manipulation;
}

.mainButton:active{
  transform:translateY(4px);

  box-shadow:
    0 2px 0 #650000;
}

.secondary{
  width:100%;
  min-height:55px;

  margin-top:12px;

  border:0;
  border-radius:16px;

  background:#222;

  color:#fff;

  font-size:17px;
  font-weight:900;
}

.small{
  margin-top:18px;

  color:#aaa;

  font-size:13px;
  line-height:1.6;
}

.finalScore{
  margin:15px 0;

  font-size:55px;
  font-weight:1000;
}

.rank{
  margin-bottom:20px;

  color:#ffe600;

  font-size:22px;
  font-weight:1000;
}

.hidden{
  display:none !important;
}

</style>
</head>


<body>

<div id="game">

  <video
    id="camera"
    autoplay
    muted
    playsinline>
  </video>

  <div id="field"></div>


  <div id="hud">

    <div>

      SCORE

      <div id="score">
        0
      </div>

      <div id="combo">
        COMBO ×1
      </div>

    </div>


    <div>

      <div id="time">
        60
      </div>

      <div id="lives">
        ❤️❤️❤️
      </div>

    </div>

  </div>


  <!-- 固定照準 -->

  <div id="crosshair">

    <div class="ring"></div>

    <div class="lineH"></div>

    <div class="lineV"></div>

    <div class="dot"></div>

  </div>


  <div id="banner"></div>


  <!-- 攻撃ボタン -->

  <button id="attack">
    🔫 ATTACK
  </button>


  <!-- START -->

  <div
    id="start"
    class="overlay">

    <div class="panel">

      <div class="logo">
        CAMERA<br>
        HUNTER
      </div>

      <div class="sub">

        📱 スマホを動かして敵を探す<br>
        🎯 中央に敵を合わせる<br>
        🔫 ATTACKで撃つ

      </div>

      <button
        id="startButton"
        class="mainButton">

        📷 START

      </button>

      <div class="small">

        カメラとモーションセンサーを使用します。<br>
        許可が表示されたら「許可」を押してください。

      </div>

    </div>

  </div>


  <!-- SENSOR ERROR -->

  <div
    id="sensorError"
    class="overlay hidden">

    <div class="panel">

      <div class="logo">
        SENSOR ERROR
      </div>

      <div class="sub">

        モーションセンサーを利用できませんでした。<br><br>

        センサーの許可を確認して、<br>
        もう一度試してください。

      </div>

      <button
        id="sensorRetry"
        class="mainButton">

        🔄 RETRY

      </button>

    </div>

  </div>


  <!-- CAMERA ERROR -->

  <div
    id="cameraError"
    class="overlay hidden">

    <div class="panel">

      <div class="logo">
        CAMERA ERROR
      </div>

      <div class="sub">
        カメラを起動できませんでした。
      </div>

      <button
        id="cameraRetry"
        class="mainButton">

        📷 RETRY

      </button>

    </div>

  </div>


  <!-- GAME OVER -->

  <div
    id="gameOver"
    class="overlay hidden">

    <div class="panel">

      <div class="logo">
        GAME OVER
      </div>

      <div
        id="finalScore"
        class="finalScore">

        0

      </div>

      <div
        id="rank"
        class="rank">

        RANK D

      </div>

      <button
        id="retryButton"
        class="mainButton">

        🔥 AGAIN

      </button>

      <button
        id="stopButton"
        class="secondary">

        カメラを停止

      </button>

    </div>

  </div>

</div>


<script>

"use strict";


/* =====================================
   DOM
===================================== */

const camera =
  document.getElementById(
    "camera"
  );

const field =
  document.getElementById(
    "field"
  );

const start =
  document.getElementById(
    "start"
  );

const startButton =
  document.getElementById(
    "startButton"
  );

const sensorError =
  document.getElementById(
    "sensorError"
  );

const sensorRetry =
  document.getElementById(
    "sensorRetry"
  );

const cameraError =
  document.getElementById(
    "cameraError"
  );

const cameraRetry =
  document.getElementById(
    "cameraRetry"
  );

const gameOver =
  document.getElementById(
    "gameOver"
  );

const retryButton =
  document.getElementById(
    "retryButton"
  );

const stopButton =
  document.getElementById(
    "stopButton"
  );

const attack =
  document.getElementById(
    "attack"
  );

const crosshair =
  document.getElementById(
    "crosshair"
  );

const scoreEl =
  document.getElementById(
    "score"
  );

const comboEl =
  document.getElementById(
    "combo"
  );

const timeEl =
  document.getElementById(
    "time"
  );

const livesEl =
  document.getElementById(
    "lives"
  );

const finalScore =
  document.getElementById(
    "finalScore"
  );

const rankEl =
  document.getElementById(
    "rank"
  );

const banner =
  document.getElementById(
    "banner"
  );


/* =====================================
   GAME STATE
===================================== */

let stream = null;

let playing = false;

let score = 0;

let combo = 0;

let lives = 3;

let time = 60;

let elapsed = 0;

let enemyId = 0;

let enemies = new Map();

let timer = null;

let spawnTimer = null;

let lastShot = 0;


/* =====================================
   SENSOR STATE
===================================== */

/*
 * 現在のスマホの向き
 */

let currentAlpha = null;
let currentBeta = null;


/*
 * ゲーム開始時の向き
 *
 * ここは「画面座標」ではなく
 * カメラの基準方向。
 */

let baseAlpha = null;
let baseBeta = null;

let sensorReady = false;


/* =====================================
   SENSOR
===================================== */

function onOrientation(event){

  if(
    event.alpha == null ||
    event.beta == null
  ){
    return;
  }


  currentAlpha =
    event.alpha;

  currentBeta =
    event.beta;


  sensorReady = true;

}


async function enableMotion(){

  if(
    typeof DeviceOrientationEvent ===
    "undefined"
  ){

    return false;

  }


  /*
   * iPhone Safari
   */

  if(
    typeof DeviceOrientationEvent
      .requestPermission ===
    "function"
  ){

    try{

      const result =
        await DeviceOrientationEvent
          .requestPermission();


      if(
        result !== "granted"
      ){

        return false;

      }

    }catch(e){

      return false;

    }

  }


  window.addEventListener(
    "deviceorientation",
    onOrientation,
    true
  );


  return true;

}


/* =====================================
   CAMERA
===================================== */

async function openCamera(){

  cameraError.classList.add(
    "hidden"
  );


  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "camera unavailable"
      );

    }


    stopCamera();


    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:"environment"
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }

          },

          audio:false

        });


    camera.srcObject =
      stream;


    await camera.play();


    return true;

  }catch(e){

    cameraError.classList.remove(
      "hidden"
    );

    return false;

  }

}


function stopCamera(){

  if(!stream)
    return;


  stream
    .getTracks()
    .forEach(
      track =>
        track.stop()
    );


  stream = null;

  camera.srcObject = null;

}


/* =====================================
   ANGLE FUNCTIONS
===================================== */

function normalizeAngle(
  value
){

  while(
    value > 180
  ){
    value -= 360;
  }


  while(
    value < -180
  ){
    value += 360;
  }


  return value;

}


/*
 * 現在のカメラが
 * ゲーム開始地点から何度動いたか
 */

function getViewYaw(){

  if(
    currentAlpha == null ||
    baseAlpha == null
  ){

    return 0;

  }


  return normalizeAngle(
    currentAlpha -
    baseAlpha
  );

}


function getViewPitch(){

  if(
    currentBeta == null ||
    baseBeta == null
  ){

    return 0;

  }


  return currentBeta -
         baseBeta;

}


/* =====================================
   START
===================================== */

async function prepareGame(){

  startButton.disabled =
    true;


  sensorReady = false;


  /*
   * モーション許可は
   * STARTボタンの操作中に要求
   */

  const motionPromise =
    enableMotion();


  const cameraPromise =
    openCamera();


  const [
    motionOK,
    cameraOK
  ] =
    await Promise.all([
      motionPromise,
      cameraPromise
    ]);


  startButton.disabled =
    false;


  if(!cameraOK){

    return;

  }


  if(!motionOK){

    sensorError.classList.remove(
      "hidden"
    );

    return;

  }


  /*
   * センサー値を少し待つ
   */

  const begin =
    performance.now();


  while(
    !sensorReady &&
    performance.now() -
    begin < 1500
  ){

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          50
        )
    );

  }


  if(!sensorReady){

    sensorError.classList.remove(
      "hidden"
    );

    return;

  }


  /*
   * ★ ここが重要 ★
   *
   * ゲーム開始時の向きを
   * 「世界の0度」にする。
   */

  baseAlpha =
    currentAlpha;

  baseBeta =
    currentBeta;


  start.classList.add(
    "hidden"
  );


  sensorError.classList.add(
    "hidden"
  );


  gameStart();

}


/* =====================================
   GAME START
===================================== */

function gameStart(){

  stopGame();


  score = 0;

  combo = 0;

  lives = 3;

  time = 60;

  elapsed = 0;

  playing = true;


  updateHUD();


  /*
   * 敵を3体配置
   */

  spawnEnemy();
  spawnEnemy();
  spawnEnemy();


  /*
   * 敵を追加
   */

  spawnTimer =
    setInterval(
      () => {

        if(!playing)
          return;


        let amount = 1;


        if(
          elapsed >= 20
        ){

          amount = 2;

        }


        if(
          elapsed >= 40
        ){

          amount = 3;

        }


        for(
          let i=0;
          i<amount;
          i++
        ){

          setTimeout(
            spawnEnemy,
            i * 200
          );

        }

      },
      1500
    );


  /*
   * タイマー
   */

  timer =
    setInterval(
      () => {

        if(!playing)
          return;


        time--;

        elapsed++;


        if(time === 45){

          showBanner(
            "WAVE 2"
          );

        }


        if(time === 30){

          showBanner(
            "👑 BOSS"
          );

          spawnBoss();

        }


        if(time === 15){

          showBanner(
            "FINAL WAVE"
          );

        }


        updateHUD();


        if(
          time <= 0
        ){

          endGame();

        }

      },
      1000
    );


  requestAnimationFrame(
    gameLoop
  );

}


/* =====================================
   SPAWN ENEMY
===================================== */

function spawnEnemy(){

  if(!playing)
    return;


  if(
    enemies.size >= 12
  ){
    return;
  }


  /*
   * ★重要★
   *
   * 現在のスマホの向きは
   * 「一度だけ」ここで使う。
   *
   * その後は絶対に変更しない。
   *
   * これが「敵が逃げない」ための
   * ポイント。
   */

  const currentYaw =
    getViewYaw();

  const currentPitch =
    getViewPitch();


  /*
   * 現在位置から
   * 20〜55度離れた場所へ配置
   */

  const side =
    Math.random() < .5
      ? -1
      : 1;


  const yaw =
    currentYaw +
    side *
    (
      25 +
      Math.random() * 30
    );


  const pitch =
    currentPitch +
    (
      Math.random() * 40 -
      20
    );


  const element =
    document.createElement(
      "div"
    );


  element.className =
    "enemy";


  const body =
    document.createElement(
      "div"
    );


  body.className =
    "enemyBody";


  element.appendChild(
    body
  );


  field.appendChild(
    element
  );


  /*
   * ★敵の世界座標★
   *
   * yaw / pitch は
   * spawn後に変更しない。
   */

  const enemy = {

    id:
      ++enemyId,

    element,

    worldYaw:
      yaw,

    worldPitch:
      pitch,

    hp:1,

    maxHp:1,

    boss:false,

    born:
      performance.now(),

    lifetime:
      6500 +
      Math.random() * 2000

  };


  enemies.set(
    enemy.id,
    enemy
  );

}


/* =====================================
   BOSS
===================================== */

function spawnBoss(){

  if(!playing)
    return;


  const currentYaw =
    getViewYaw();

  const currentPitch =
    getViewPitch();


  /*
   * ボスはかなり遠い位置
   */

  const side =
    Math.random() < .5
      ? -1
      : 1;


  const element =
    document.createElement(
      "div"
    );


  element.className =
    "enemy boss";


  const body =
    document.createElement(
      "div"
    );


  body.className =
    "enemyBody";


  element.appendChild(
    body
  );


  const hp =
    document.createElement(
      "div"
    );


  hp.className =
    "hp";


  const fill =
    document.createElement(
      "i"
    );


  hp.appendChild(
    fill
  );


  element.appendChild(
    hp
  );


  field.appendChild(
    element
  );


  const enemy = {

    id:
      ++enemyId,

    element,

    worldYaw:
      currentYaw +
      side *
      (
        30 +
        Math.random() * 15
      ),

    worldPitch:
      currentPitch +
      (
        Math.random() * 24 -
        12
      ),

    hp:5,

    maxHp:5,

    hpFill:fill,

    boss:true,

    born:
      performance.now(),

    lifetime:12000

  };


  enemies.set(
    enemy.id,
    enemy
  );

}


/* =====================================
   PROJECT WORLD → SCREEN
===================================== */

/*
 * ★★★★★★★★★★★★★★★★★★★★★
 *
 * ここが今回の本丸。
 *
 * enemy.worldYaw
 * enemy.worldPitch
 *
 * は固定。
 *
 * スマホを動かした結果だけで
 * screenX / screenY が変わる。
 *
 * 敵自身は一切動かない。
 *
 * ★★★★★★★★★★★★★★★★★★★★★
 */

function projectEnemy(
  enemy
){

  const width =
    window.innerWidth;

  const height =
    window.innerHeight;


  /*
   * 現在のスマホの向き
   */

  const cameraYaw =
    getViewYaw();

  const cameraPitch =
    getViewPitch();


  /*
   * 世界座標とカメラの角度差
   */

  const yawDifference =
    normalizeAngle(
      enemy.worldYaw -
      cameraYaw
    );


  const pitchDifference =
    enemy.worldPitch -
    cameraPitch;


  /*
   * カメラの視野角
   */

  const horizontalFOV =
    70;

  const verticalFOV =
    55;


  /*
   * ★左右反転★
   *
   * スマホを右へ向ける
   * ↓
   * 敵は左へ動く
   *
   * なので
   * world - camera
   * を使う。
   */

  const screenX =
    width / 2 +
    (
      yawDifference /
      horizontalFOV
    ) *
    width;


  /*
   * 上下
   */

  const screenY =
    height / 2 +
    (
      pitchDifference /
      verticalFOV
    ) *
    height;


  /*
   * 時間経過で敵が近づく
   */

  const age =
    performance.now() -
    enemy.born;


  const progress =
    Math.min(
      1,
      age /
      enemy.lifetime
    );


  /*
   * 小さい → 大きい
   */

  const scale =
    enemy.boss
      ? .55 +
        progress * .9
      : .40 +
        progress * 1.2;


  enemy.element.style.left =
    screenX + "px";


  enemy.element.style.top =
    screenY + "px";


  enemy.element.style.transform =
    "translate(-50%,-50%) " +
    "scale(" +
    scale +
    ")";


  /*
   * 画面外なら薄くする
   */

  if(
    screenX < -150 ||
    screenX > width + 150 ||
    screenY < -150 ||
    screenY > height + 150
  ){

    enemy.element.style.opacity =
      ".3";

  }else{

    enemy.element.style.opacity =
      "1";

  }


  return {
    x:screenX,
    y:screenY,
    scale
  };

}


/* =====================================
   FIND TARGET
===================================== */

function getTarget(){

  const centerX =
    window.innerWidth / 2;

  const centerY =
    window.innerHeight / 2;


  let target = null;

  let closest =
    Infinity;


  enemies.forEach(
    enemy => {

      const position =
        projectEnemy(
          enemy
        );


      const dx =
        position.x -
        centerX;


      const dy =
        position.y -
        centerY;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      /*
       * 中央の照準に入ったら
       * ロック可能
       */

      const hitRadius =
        enemy.boss
          ? 100
          : 62;


      if(
        distance <=
        hitRadius
      ){

        if(
          distance <
          closest
        ){

          closest =
            distance;

          target =
            enemy;

        }

      }

    }
  );


  return target;

}


/* =====================================
   AIM
===================================== */

function updateAim(){

  if(!playing){

    crosshair.classList.remove(
      "locked"
    );

    return;

  }


  const target =
    getTarget();


  if(target){

    crosshair.classList.add(
      "locked"
    );

  }else{

    crosshair.classList.remove(
      "locked"
    );

  }

}


/* =====================================
   ATTACK
===================================== */

function fire(){

  if(!playing)
    return;


  const now =
    performance.now();


  if(
    now -
    lastShot <
    180
  ){

    return;

  }


  lastShot =
    now;


  /*
   * 現在の照準位置にいる敵
   */

  const target =
    getTarget();


  /*
   * 敵がいない
   */

  if(!target){

    combo = 0;


    showHit(
      window.innerWidth / 2,
      window.innerHeight / 2,
      "MISS"
    );


    if(
      navigator.vibrate
    ){

      navigator.vibrate(15);

    }


    updateHUD();

    return;

  }


  /*
   * 命中
   */

  target.hp--;

  combo++;


  const multiplier =
    Math.min(
      10,
      Math.max(
        1,
        combo
      )
    );


  /*
   * ボスにまだHPがある
   */

  if(
    target.hp > 0
  ){

    score +=
      100 *
      multiplier;


    const position =
      projectEnemy(
        target
      );


    showHit(
      position.x,
      position.y,
      "HIT!"
    );


    if(target.hpFill){

      target.hpFill.style.width =
        (
          target.hp /
          target.maxHp *
          100
        ) + "%";

    }


    if(
      navigator.vibrate
    ){

      navigator.vibrate(25);

    }


    updateHUD();

    return;

  }


  /*
   * 撃破
   */

  const points =
    target.boss
      ? 3000 * multiplier
      : 150 * multiplier;


  score += points;


  const position =
    projectEnemy(
      target
    );


  showHit(
    position.x,
    position.y,
    "+" + points
  );


  explode(
    position.x,
    position.y,
    target.boss
      ? 160
      : 80
  );


  target.element.remove();


  enemies.delete(
    target.id
  );


  if(target.boss){

    showBanner(
      "💥 BOSS DOWN!"
    );

  }


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      target.boss
        ? [50,30,100]
        : 30
    );

  }


  updateHUD();

}


/* =====================================
   GAME LOOP
===================================== */

function gameLoop(){

  if(!playing)
    return;


  const now =
    performance.now();


  enemies.forEach(
    enemy => {

      /*
       * 敵が逃げるのではなく、
       * 「存在時間」が過ぎたら消える。
       */

      const age =
        now -
        enemy.born;


      if(
        age >
        enemy.lifetime
      ){

        enemy.element.remove();


        enemies.delete(
          enemy.id
        );


        /*
         * 逃した
         */

        lives--;

        combo = 0;


        updateHUD();


        if(
          lives <= 0
        ){

          endGame();

        }


        return;

      }


      /*
       * ここで変更されるのは
       * 画面上の位置だけ。
       *
       * worldYaw / worldPitchは
       * 一切変更しない。
       */

      projectEnemy(
        enemy
      );

    }
  );


  updateAim();


  requestAnimationFrame(
    gameLoop
  );

}


/* =====================================
   HUD
===================================== */

function updateHUD(){

  scoreEl.textContent =
    score.toLocaleString();


  comboEl.textContent =
    "COMBO ×" +
    Math.max(
      1,
      combo
    );


  timeEl.textContent =
    time;


  livesEl.textContent =
    "❤️".repeat(lives) +
    "🖤".repeat(
      3 - lives
    );

}


/* =====================================
   EFFECTS
===================================== */

function showHit(
  x,
  y,
  text
){

  const element =
    document.createElement(
      "div"
    );


  element.className =
    "hit";


  element.textContent =
    text;


  element.style.left =
    x + "px";


  element.style.top =
    y + "px";


  field.appendChild(
    element
  );


  setTimeout(
    () =>
      element.remove(),
    650
  );

}


function explode(
  x,
  y,
  size
){

  const element =
    document.createElement(
      "div"
    );


  element.className =
    "explosion";


  element.style.left =
    x + "px";


  element.style.top =
    y + "px";


  element.style.width =
    size + "px";


  element.style.height =
    size + "px";


  field.appendChild(
    element
  );


  setTimeout(
    () =>
      element.remove(),
    500
  );

}


let bannerTimer;


function showBanner(
  text
){

  banner.textContent =
    text;

  banner.style.opacity =
    "1";


  clearTimeout(
    bannerTimer
  );


  bannerTimer =
    setTimeout(
      () => {

        banner.style.opacity =
          "0";

      },
      1100
    );

}


/* =====================================
   END
===================================== */

function endGame(){

  if(!playing)
    return;


  playing = false;


  stopGame();


  finalScore.textContent =
    score.toLocaleString();


  rankEl.textContent =
    getRank(score);


  gameOver.classList.remove(
    "hidden"
  );

}


function stopGame(){

  clearInterval(
    timer
  );

  clearInterval(
    spawnTimer
  );


  timer = null;

  spawnTimer = null;


  enemies.forEach(
    enemy =>
      enemy.element.remove()
  );


  enemies.clear();

}


function getRank(
  value
){

  if(value >= 20000)
    return "RANK S";

  if(value >= 12000)
    return "RANK A";

  if(value >= 7000)
    return "RANK B";

  if(value >= 3000)
    return "RANK C";

  return "RANK D";

}


/* =====================================
   BUTTONS
===================================== */

startButton.addEventListener(
  "click",
  prepareGame
);


sensorRetry.addEventListener(
  "click",
  prepareGame
);


cameraRetry.addEventListener(
  "click",
  prepareGame
);


/*
 * 攻撃はこのボタンだけ
 */

attack.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    event.stopPropagation();

    fire();

  },
  {
    passive:false
  }
);


retryButton.addEventListener(
  "click",
  () => {

    gameOver.classList.add(
      "hidden"
    );


    /*
     * リトライ時の向きを
     * 新しい基準にする
     */

    baseAlpha =
      currentAlpha;

    baseBeta =
      currentBeta;


    gameStart();

  }
);


stopButton.addEventListener(
  "click",
  () => {

    playing = false;

    stopGame();

    stopCamera();


    gameOver.classList.add(
      "hidden"
    );


    start.classList.remove(
      "hidden"
    );

  }
);


/* =====================================
   ZOOM PREVENTION
===================================== */

function preventZoom(
  event
){

  event.preventDefault();

}


document.addEventListener(
  "dblclick",
  preventZoom,
  {
    passive:false
  }
);


document.addEventListener(
  "gesturestart",
  preventZoom,
  {
    passive:false
  }
);


document.addEventListener(
  "gesturechange",
  preventZoom,
  {
    passive:false
  }
);


document.addEventListener(
  "gestureend",
  preventZoom,
  {
    passive:false
  }
);


updateHUD();

</script>
