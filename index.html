<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no">

<title>CAMERA HUNTER</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#000;
}

#camera{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:1;
}

#dark{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.12);
  z-index:2;
  pointer-events:none;
}

/* HUD */

#hud{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:10;
  padding:
    calc(env(safe-area-inset-top) + 12px)
    15px
    0;
  color:white;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
  pointer-events:none;
}

#top{
  display:flex;
  justify-content:space-between;
  font-size:17px;
}

#status{
  margin-top:6px;
  text-align:center;
  font-size:13px;
}

/* CROSSHAIR */

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:70px;
  height:70px;
  transform:translate(-50%,-50%);
  z-index:8;
  pointer-events:none;
}

#crosshair::before,
#crosshair::after{
  content:"";
  position:absolute;
  background:#00ff66;
  box-shadow:0 0 8px #00ff66;
}

#crosshair::before{
  width:70px;
  height:2px;
  left:0;
  top:34px;
}

#crosshair::after{
  width:2px;
  height:70px;
  left:34px;
  top:0;
}

#dot{
  position:absolute;
  width:7px;
  height:7px;
  background:#00ff66;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

/* ENEMY */

.enemy{
  position:absolute;
  width:85px;
  height:85px;
  transform:translate(-50%,-50%);
  z-index:7;
  display:none;
  pointer-events:none;
}

.enemyBody{
  position:absolute;
  width:64px;
  height:64px;
  left:10px;
  top:10px;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 35% 30%,
      #ff8b8b,
      #ff2020 35%,
      #850000 75%
    );
  border:3px solid white;
  box-shadow:
    0 0 12px #ff0000,
    0 0 30px rgba(255,0,0,.7);
}

.enemyEye{
  position:absolute;
  width:11px;
  height:15px;
  background:#000;
  border-radius:50%;
  top:27px;
}

.enemyEye.left{
  left:25px;
}

.enemyEye.right{
  right:25px;
}

.enemyMouth{
  position:absolute;
  width:25px;
  height:10px;
  border-bottom:4px solid #000;
  border-radius:50%;
  left:29px;
  top:43px;
}

/* HIT */

#hit{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:70px;
  color:#fff;
  font-weight:bold;
  z-index:20;
  display:none;
  text-shadow:
    0 0 10px red,
    0 0 30px red;
}

/* ATTACK */

#attack{
  position:absolute;
  left:50%;
  bottom:
    calc(env(safe-area-inset-bottom) + 25px);
  transform:translateX(-50%);
  width:170px;
  height:72px;
  border:3px solid white;
  border-radius:40px;
  background:rgba(180,0,0,.75);
  color:white;
  font-size:25px;
  font-weight:900;
  z-index:30;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

#attack:active{
  transform:translateX(-50%) scale(.94);
  background:rgba(255,0,0,.9);
}

/* START */

#startScreen{
  position:absolute;
  inset:0;
  z-index:100;
  background:
    radial-gradient(
      circle,
      rgba(30,30,30,.96),
      rgba(0,0,0,.99)
    );

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  text-align:center;
}

#title{
  font-size:42px;
  font-weight:1000;
  letter-spacing:3px;
  text-shadow:
    0 0 10px red,
    0 0 30px red;
}

#description{
  margin-top:15px;
  line-height:1.8;
  font-size:15px;
  opacity:.9;
}

#startButton{
  margin-top:35px;
  width:220px;
  height:70px;
  border:3px solid white;
  border-radius:40px;
  background:#d40000;
  color:white;
  font-size:25px;
  font-weight:900;
  touch-action:none;
}

#startButton:active{
  transform:scale(.94);
}

/* DEBUG */

#debug{
  position:absolute;
  left:10px;
  bottom:
    calc(env(safe-area-inset-bottom) + 110px);
  color:white;
  font-size:11px;
  z-index:25;
  text-shadow:0 1px 3px #000;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="game">

  <video
    id="camera"
    autoplay
    playsinline
    muted>
  </video>

  <div id="dark"></div>

  <div id="hud">
    <div id="top">
      <div>🎯 SCORE <span id="score">0</span></div>
      <div>🔥 COMBO <span id="combo">0</span></div>
    </div>

    <div id="status">
      STARTを押してください
    </div>
  </div>

  <div id="crosshair">
    <div id="dot"></div>
  </div>

  <div id="enemy" class="enemy">
    <div class="enemyBody"></div>
    <div class="enemyEye left"></div>
    <div class="enemyEye right"></div>
    <div class="enemyMouth"></div>
  </div>

  <div id="hit">
    HIT!
  </div>

  <div id="debug"></div>

  <button id="attack">
    🔥 ATTACK
  </button>

  <!-- START -->
  <div id="startScreen">

    <div id="title">
      CAMERA<br>
      HUNTER
    </div>

    <div id="description">
      📱 カメラを動かして敵を狙え<br>
      🎯 中央に敵を合わせろ<br>
      🔥 ATTACKで攻撃
    </div>

    <button id="startButton">
      START
    </button>

  </div>

</div>

<script>

/* =========================
   DOM
========================= */

const camera =
  document.getElementById("camera");

const startScreen =
  document.getElementById("startScreen");

const startButton =
  document.getElementById("startButton");

const attackButton =
  document.getElementById("attack");

const enemy =
  document.getElementById("enemy");

const scoreElement =
  document.getElementById("score");

const comboElement =
  document.getElementById("combo");

const statusElement =
  document.getElementById("status");

const hitElement =
  document.getElementById("hit");

const debugElement =
  document.getElementById("debug");


/* =========================
   GAME STATE
========================= */

let playing = false;

let score = 0;
let combo = 0;

let currentHeading = null;

/*
  敵の方向。
  一度決めたら絶対に変更しない。
*/
let enemyHeading = null;


/* =========================
   ANGLE
========================= */

function normalizeAngle(angle){

  while(angle > 180){
    angle -= 360;
  }

  while(angle < -180){
    angle += 360;
  }

  return angle;
}


/* =========================
   CAMERA
========================= */

async function startCamera(){

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1920
          },

          height:{
            ideal:1080
          }
        },

        audio:false

      });

    camera.srcObject = stream;

    await camera.play();

    statusElement.textContent =
      "📷 カメラOK";

  }catch(error){

    console.log(error);

    statusElement.textContent =
      "📷 カメラを使用できません";

  }

}


/* =========================
   SENSOR
========================= */

let sensorStarted = false;

async function startSensor(){

  /*
    iPhone Safari
  */

  if(
    typeof DeviceOrientationEvent !==
    "undefined" &&
    typeof DeviceOrientationEvent
      .requestPermission ===
      "function"
  ){

    try{

      const permission =
        await DeviceOrientationEvent
          .requestPermission();

      if(permission !== "granted"){

        statusElement.textContent =
          "⚠️ センサー許可が必要";

        return;

      }

    }catch(error){

      console.log(error);

    }

  }


  window.addEventListener(
    "deviceorientation",
    orientationHandler,
    true
  );

  window.addEventListener(
    "deviceorientationabsolute",
    orientationHandler,
    true
  );

  sensorStarted = true;

}


/* =========================
   ORIENTATION
========================= */

function orientationHandler(event){

  /*
    iPhoneなら
    webkitCompassHeadingを最優先
  */

  if(
    typeof event.webkitCompassHeading ===
    "number" &&
    !isNaN(event.webkitCompassHeading)
  ){

    currentHeading =
      event.webkitCompassHeading;

  }

}


/* =========================
   SPAWN ENEMY
========================= */

function spawnEnemy(){

  /*
    センサーが取れていれば
    今いる方向を基準にする。

    ★重要
    ここで一度だけ決める。
    毎フレーム変更しない。
  */

  if(currentHeading !== null){

    /*
      最初は必ず画面内に出す。

      例：
      現在方向 + 20度
    */

    enemyHeading =
      (currentHeading + 20 + 360) % 360;

  }else{

    /*
      センサーがまだ取れない場合
      とりあえず正面
    */

    enemyHeading = 0;

  }

  enemy.style.display = "block";

  statusElement.textContent =
    "🎯 カメラを動かして敵を中央へ";

}


/* =========================
   PROJECT ENEMY
========================= */

function updateEnemy(){

  if(!playing){
    return;
  }

  if(enemyHeading === null){
    return;
  }

  /*
    センサーがまだ取れていない
  */

  if(currentHeading === null){

    enemy.style.left = "50%";
    enemy.style.top = "50%";

    return;

  }


  /*
    敵の絶対方向
    -
    現在カメラ方向

    ★これが重要
  */

  const difference =
    normalizeAngle(
      enemyHeading -
      currentHeading
    );


  /*
    視野角。

    数字が小さいほど
    敵が画面端へ行きやすい。
  */

  const FOV = 70;


  /*
    画面Xに変換
  */

  const x =
    50 +
    (difference / FOV) * 50;


  /*
    画面内なら表示
  */

  if(x > -20 && x < 120){

    enemy.style.left =
      x + "%";

    enemy.style.top =
      "50%";

    enemy.style.display =
      "block";

  }else{

    /*
      視界外。

      ★消さない。
      空間上には存在している。
    */

    enemy.style.display =
      "none";

  }


  debugElement.textContent =
    currentHeading === null
      ? "sensor: waiting"
      :
      "heading: " +
      currentHeading.toFixed(1) +
      "°  enemy: " +
      enemyHeading.toFixed(1) +
      "°  diff: " +
      difference.toFixed(1) +
      "°";

}


/* =========================
   ATTACK
========================= */

function attack(){

  if(!playing){
    return;
  }

  /*
    敵が画面に見えているか
  */

  if(
    enemy.style.display !==
    "none"
  ){

    const rect =
      enemy.getBoundingClientRect();

    const centerX =
      window.innerWidth / 2;

    const centerY =
      window.innerHeight / 2;

    const enemyX =
      rect.left +
      rect.width / 2;

    const enemyY =
      rect.top +
      rect.height / 2;

    const dx =
      enemyX - centerX;

    const dy =
      enemyY - centerY;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );


    /*
      十分中央に近ければHIT
    */

    if(distance < 90){

      score +=
        100 +
        combo * 20;

      combo++;

      scoreElement.textContent =
        score;

      comboElement.textContent =
        combo;


      hitElement.style.display =
        "block";

      setTimeout(
        ()=>{
          hitElement.style.display =
            "none";
        },
        180
      );


      /*
        次の敵。

        ★新しい方向も
        現在方向から一度だけ決定
      */

      spawnNextEnemy();

      return;

    }

  }


  /*
    外した
  */

  combo = 0;

  comboElement.textContent =
    combo;

}


/* =========================
   NEXT ENEMY
========================= */

function spawnNextEnemy(){

  if(currentHeading === null){

    enemyHeading = 0;

  }else{

    /*
      現在方向から
      ランダムな方向へ。

      ここでも一度だけ。
    */

    const offsets = [
      -35,
      -25,
      25,
      35,
      50,
      -50
    ];

    const offset =
      offsets[
        Math.floor(
          Math.random() *
          offsets.length
        )
      ];

    enemyHeading =
      (
        currentHeading +
        offset +
        360
      ) % 360;

  }

  enemy.style.display =
    "block";

}


/* =========================
   GAME LOOP
========================= */

function loop(){

  if(playing){

    updateEnemy();

  }

  requestAnimationFrame(loop);

}


/* =========================
   START
========================= */

startButton.addEventListener(
  "click",
  async function(event){

    event.preventDefault();

    /*
      ★★★最重要★★★

      START画面を
      最初に消す。

      センサーやカメラで
      エラーが出ても
      START画面が残らない。
    */

    startScreen.style.display =
      "none";


    startButton.disabled =
      true;


    playing = true;


    score = 0;
    combo = 0;


    scoreElement.textContent =
      "0";

    comboElement.textContent =
      "0";


    statusElement.textContent =
      "📱 カメラ起動中…";


    /*
      カメラ
    */

    startCamera();


    /*
      センサー
    */

    await startSensor();


    /*
      少し待つ。

      iPhoneがセンサー値を
      取得する時間を確保。
    */

    setTimeout(
      ()=>{

        spawnEnemy();

      },
      500
    );


    requestAnimationFrame(
      loop
    );

  },
  {
    passive:false
  }
);


/* =========================
   ATTACK BUTTON
========================= */

attackButton.addEventListener(
  "touchstart",
  function(event){

    event.preventDefault();

    attack();

  },
  {
    passive:false
  }
);

attackButton.addEventListener(
  "click",
  function(event){

    event.preventDefault();

    attack();

  }
);


/* =========================
   MOBILE PROTECTION
========================= */

document.addEventListener(
  "contextmenu",
  function(e){

    e.preventDefault();

  }
);

document.addEventListener(
  "selectstart",
  function(e){

    e.preventDefault();

  }
);

document.addEventListener(
  "gesturestart",
  function(e){

    e.preventDefault();

  }
);

document.addEventListener(
  "dblclick",
  function(e){

    e.preventDefault();

  }
);


/* =========================
   STARTUP
========================= */

attackButton.style.display =
  "block";

</script>

</body>
</html>
