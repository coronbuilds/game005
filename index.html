<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>CAMERA HUNTER AR</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
}

body{
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#000;
}

#camera{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  pointer-events:none;
}

/* =========================
   FIELD
========================= */

#field{
  position:absolute;
  inset:0;
  pointer-events:none;
}

/* =========================
   HUD
========================= */

#hud{
  position:absolute;
  z-index:50;
  top:0;
  left:0;
  right:0;

  padding:
    calc(env(safe-area-inset-top) + 12px)
    15px 10px;

  display:flex;
  justify-content:space-between;

  color:#fff;

  text-shadow:
    0 2px 5px #000;

  pointer-events:none;
}

#score{
  font-size:26px;
  font-weight:1000;
}

#combo{
  color:#ffe600;
  font-weight:1000;
}

#time{
  font-size:26px;
  font-weight:1000;
  text-align:right;
}

#lives{
  text-align:right;
  margin-top:2px;
}

/* =========================
   CROSSHAIR
========================= */

#crosshair{
  position:absolute;
  z-index:80;

  left:50%;
  top:50%;

  width:105px;
  height:105px;

  transform:
    translate(-50%,-50%);

  pointer-events:none;
}

.ring{
  position:absolute;
  inset:14px;

  border:
    3px solid rgba(255,255,255,.95);

  border-radius:50%;

  box-shadow:
    0 0 8px #000;
}

.lineH,
.lineV{
  position:absolute;
  background:#fff;
  box-shadow:0 0 5px #000;
}

.lineH{
  width:105px;
  height:2px;
  top:51px;
  left:0;
}

.lineV{
  width:2px;
  height:105px;
  left:51px;
  top:0;
}

.dot{
  position:absolute;
  left:50%;
  top:50%;

  width:7px;
  height:7px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:#ff2020;

  box-shadow:
    0 0 8px red;
}

#crosshair.locked .ring{
  border-color:#ff2222;

  box-shadow:
    0 0 12px red,
    0 0 30px rgba(255,0,0,.8);
}

#crosshair.locked .lineH,
#crosshair.locked .lineV{
  background:#ff2222;
}

/* =========================
   TARGET
========================= */

.enemy{
  position:absolute;

  width:75px;
  height:75px;

  transform:
    translate(-50%,-50%);

  pointer-events:none;
}

.enemyBody{
  width:100%;
  height:100%;

  border:
    3px solid #fff;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 35%,
      white 0 5%,
      transparent 6%
    ),
    radial-gradient(
      circle at 65% 35%,
      white 0 5%,
      transparent 6%
    ),
    radial-gradient(
      circle at 35% 35%,
      red 0 14%,
      transparent 15%
    ),
    radial-gradient(
      circle at 65% 35%,
      red 0 14%,
      transparent 15%
    ),
    radial-gradient(
      circle at 50% 68%,
      #111 0 20%,
      transparent 21%
    ),
    linear-gradient(
      145deg,
      #ff3030,
      #620000
    );

  box-shadow:
    0 0 15px red,
    0 0 35px red;
}

.enemy.boss{
  width:140px;
  height:140px;
}

.enemy.boss .enemyBody{
  border-width:5px;

  box-shadow:
    0 0 25px red,
    0 0 70px red;
}

.hp{
  position:absolute;

  top:-14px;
  left:50%;

  width:100%;
  height:8px;

  transform:
    translateX(-50%);

  background:#111;

  border:1px solid #fff;

  border-radius:10px;

  overflow:hidden;
}

.hp i{
  display:block;

  width:100%;
  height:100%;

  background:#32ff45;
}

/* =========================
   ATTACK
========================= */

#attack{
  position:absolute;
  z-index:100;

  left:50%;

  bottom:
    calc(env(safe-area-inset-bottom) + 20px);

  transform:
    translateX(-50%);

  width:190px;
  height:72px;

  border:
    3px solid #fff;

  border-radius:38px;

  background:
    linear-gradient(
      #ff3434,
      #a50000
    );

  color:#fff;

  font-size:24px;
  font-weight:1000;

  letter-spacing:2px;

  box-shadow:
    0 6px 0 #500000,
    0 0 25px rgba(255,0,0,.7);

  touch-action:manipulation;
}

#attack:active{
  transform:
    translateX(-50%)
    translateY(5px);

  box-shadow:
    0 1px 0 #500000;
}

/* =========================
   HIT
========================= */

.hit{
  position:absolute;
  z-index:120;

  transform:
    translate(-50%,-50%);

  color:#fff;

  font-size:28px;
  font-weight:1000;

  text-shadow:
    0 0 10px red,
    0 2px 5px #000;

  animation:
    hit .6s forwards;
}

@keyframes hit{
  from{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(.7);
  }

  to{
    opacity:0;
    transform:
      translate(-50%,-110px)
      scale(1.4);
  }
}

/* =========================
   EXPLOSION
========================= */

.explosion{
  position:absolute;
  z-index:110;

  border:
    4px solid #fff;

  border-radius:50%;

  transform:
    translate(-50%,-50%);

  animation:
    explosion .45s forwards;
}

@keyframes explosion{
  from{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(.2);
  }

  to{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(4);
  }
}

/* =========================
   BANNER
========================= */

#banner{
  position:absolute;
  z-index:150;

  top:27%;
  left:50%;

  transform:
    translate(-50%,-50%);

  color:#fff;

  font-size:38px;
  font-weight:1000;

  white-space:nowrap;

  text-shadow:
    0 0 15px #000;

  opacity:0;

  pointer-events:none;
}

/* =========================
   OVERLAY
========================= */

.overlay{
  position:absolute;
  z-index:200;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:25px;

  background:
    linear-gradient(
      rgba(0,0,0,.75),
      rgba(0,0,0,.95)
    );

  color:#fff;

  text-align:center;
}

.panel{
  width:min(430px,92vw);
}

.logo{
  font-size:43px;
  line-height:.9;

  font-weight:1000;
  letter-spacing:-2px;
}

.sub{
  margin:
    20px 0 25px;

  color:#ddd;

  line-height:1.7;
}

.startButton,
.retryButton{
  width:100%;
  min-height:62px;

  border:0;
  border-radius:16px;

  background:#e00000;

  color:#fff;

  font-size:19px;
  font-weight:1000;

  box-shadow:
    0 6px 0 #650000;

  touch-action:manipulation;
}

.startButton:active,
.retryButton:active{
  transform:
    translateY(4px);

  box-shadow:
    0 2px 0 #650000;
}

.small{
  margin-top:18px;

  color:#aaa;

  font-size:13px;
  line-height:1.6;
}

.finalScore{
  font-size:55px;
  font-weight:1000;
  margin:15px 0;
}

.rank{
  color:#ffe600;

  font-size:22px;
  font-weight:1000;

  margin-bottom:20px;
}

.secondary{
  width:100%;
  min-height:55px;

  margin-top:12px;

  border:0;
  border-radius:16px;

  background:#222;

  color:#fff;

  font-size:17px;
  font-weight:900;
}

.hidden{
  display:none !important;
}

</style>
</head>

<body>

<div id="game">

  <video
    id="camera"
    autoplay
    muted
    playsinline>
  </video>

  <div id="field"></div>

  <div id="hud">

    <div>
      SCORE
      <div id="score">0</div>
      <div id="combo">COMBO ×1</div>
    </div>

    <div>
      <div id="time">60</div>
      <div id="lives">❤️❤️❤️</div>
    </div>

  </div>


  <!-- 固定照準 -->

  <div id="crosshair">

    <div class="ring"></div>

    <div class="lineH"></div>

    <div class="lineV"></div>

    <div class="dot"></div>

  </div>


  <div id="banner"></div>


  <!-- 攻撃ボタン -->

  <button id="attack">
    🔫 ATTACK
  </button>


  <!-- START -->

  <div
    id="start"
    class="overlay">

    <div class="panel">

      <div class="logo">
        CAMERA<br>
        HUNTER
      </div>

      <div class="sub">

        📱 スマホを動かして敵を探す<br>
        🎯 中央に敵を合わせる<br>
        🔫 ATTACKで撃つ

      </div>

      <button
        id="startButton"
        class="startButton">

        📷 START

      </button>

      <div class="small">

        カメラとモーションセンサーを使用します。<br>
        許可が表示されたら「許可」を押してください。

      </div>

    </div>

  </div>


  <!-- SENSOR ERROR -->

  <div
    id="sensorError"
    class="overlay hidden">

    <div class="panel">

      <div class="logo">
        SENSOR ERROR
      </div>

      <div class="sub">

        モーションセンサーを取得できませんでした。<br><br>

        iPhoneのセンサー許可を確認して、<br>
        もう一度STARTしてください。

      </div>

      <button
        id="sensorRetry"
        class="startButton">

        🔄 もう一度

      </button>

    </div>

  </div>


  <!-- CAMERA ERROR -->

  <div
    id="cameraError"
    class="overlay hidden">

    <div class="panel">

      <div class="logo">
        CAMERA ERROR
      </div>

      <div class="sub">

        カメラを起動できませんでした。

      </div>

      <button
        id="cameraRetry"
        class="startButton">

        📷 もう一度

      </button>

    </div>

  </div>


  <!-- GAME OVER -->

  <div
    id="gameOver"
    class="overlay hidden">

    <div class="panel">

      <div class="logo">
        GAME OVER
      </div>

      <div
        id="finalScore"
        class="finalScore">
        0
      </div>

      <div
        id="rank"
        class="rank">
        RANK D
      </div>

      <button
        id="retryButton"
        class="retryButton">

        🔥 AGAIN

      </button>

      <button
        id="stopButton"
        class="secondary">

        カメラを停止

      </button>

    </div>

  </div>

</div>


<script>

/* =========================================
   CAMERA HUNTER AR
========================================= */

"use strict";


const camera =
  document.getElementById("camera");

const field =
  document.getElementById("field");

const start =
  document.getElementById("start");

const startButton =
  document.getElementById("startButton");

const attack =
  document.getElementById("attack");

const crosshair =
  document.getElementById("crosshair");

const sensorError =
  document.getElementById("sensorError");

const sensorRetry =
  document.getElementById("sensorRetry");

const cameraError =
  document.getElementById("cameraError");

const cameraRetry =
  document.getElementById("cameraRetry");

const gameOver =
  document.getElementById("gameOver");

const retryButton =
  document.getElementById("retryButton");

const stopButton =
  document.getElementById("stopButton");

const scoreEl =
  document.getElementById("score");

const comboEl =
  document.getElementById("combo");

const timeEl =
  document.getElementById("time");

const livesEl =
  document.getElementById("lives");

const finalScore =
  document.getElementById("finalScore");

const rankEl =
  document.getElementById("rank");

const banner =
  document.getElementById("banner");


/* =========================================
   GAME STATE
========================================= */

let stream = null;

let playing = false;

let score = 0;

let combo = 0;

let lives = 3;

let time = 60;

let elapsed = 0;

let enemyId = 0;

let enemies = new Map();

let timer = null;

let spawnTimer = null;

let lastFrame = 0;

let lastShot = 0;


/* =========================================
   SENSOR STATE
========================================= */

/*
 * 現在のスマホの向き
 */

let currentAlpha = null;
let currentBeta = null;


/*
 * ゲーム開始時の向き
 */

let baseAlpha = null;
let baseBeta = null;


/*
 * センサーが動いているか
 */

let sensorReady = false;


/*
 * 初期化
 */

function onOrientation(event){

  if(
    event.alpha === null ||
    event.beta === null
  ){
    return;
  }


  currentAlpha =
    event.alpha;

  currentBeta =
    event.beta;


  /*
   * 初回だけ基準位置を保存
   */

  if(
    baseAlpha === null
  ){

    baseAlpha =
      currentAlpha;

    baseBeta =
      currentBeta;

  }


  sensorReady = true;

}


/* =========================================
   ANGLE
========================================= */

function angleDifference(
  a,
  b
){

  let d =
    a - b;


  while(d > 180)
    d -= 360;


  while(d < -180)
    d += 360;


  return d;

}


/*
 * 現在の視線方向を
 * 基準位置から何度動かしたか
 */

function getViewYaw(){

  if(
    currentAlpha === null ||
    baseAlpha === null
  ){
    return 0;
  }


  return angleDifference(
    currentAlpha,
    baseAlpha
  );

}


function getViewPitch(){

  if(
    currentBeta === null ||
    baseBeta === null
  ){
    return 0;
  }


  return currentBeta -
         baseBeta;

}


/* =========================================
   MOTION PERMISSION
========================================= */

async function enableMotion(){

  /*
   * iPhone Safari
   */

  if(
    typeof DeviceOrientationEvent ===
    "undefined"
  ){

    return false;

  }


  /*
   * iOSではユーザー操作中に
   * requestPermissionを呼ぶ必要がある
   */

  if(
    typeof DeviceOrientationEvent
      .requestPermission ===
    "function"
  ){

    try{

      const permission =
        await DeviceOrientationEvent
          .requestPermission();


      if(
        permission !== "granted"
      ){

        return false;

      }

    }catch(error){

      return false;

    }

  }


  window.addEventListener(
    "deviceorientation",
    onOrientation,
    true
  );


  return true;

}


/* =========================================
   CAMERA
========================================= */

async function openCamera(){

  cameraError.classList.add(
    "hidden"
  );


  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "camera unavailable"
      );

    }


    stopCamera();


    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:"environment"
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }
          },

          audio:false

        });


    camera.srcObject =
      stream;


    await camera.play();


    return true;

  }catch(error){

    cameraError.classList.remove(
      "hidden"
    );

    return false;

  }

}


function stopCamera(){

  if(!stream)
    return;


  stream
    .getTracks()
    .forEach(
      track =>
        track.stop()
    );


  stream = null;

  camera.srcObject = null;

}


/* =========================================
   START
========================================= */

async function prepareGame(){

  startButton.disabled =
    true;


  /*
   * 重要：
   * motion permissionを先に要求する。
   */

  const motionPromise =
    enableMotion();


  const cameraPromise =
    openCamera();


  const [
    motionOK,
    cameraOK
  ] =
    await Promise.all([
      motionPromise,
      cameraPromise
    ]);


  startButton.disabled =
    false;


  if(!cameraOK){

    return;

  }


  if(!motionOK){

    sensorError.classList.remove(
      "hidden"
    );

    return;

  }


  /*
   * 少し待ってセンサー値を取得
   */

  const startWait =
    performance.now();


  while(
    !sensorReady &&
    performance.now() -
    startWait < 1500
  ){

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          50
        )
    );

  }


  if(!sensorReady){

    sensorError.classList.remove(
      "hidden"
    );

    return;

  }


  start.classList.add(
    "hidden"
  );


  sensorError.classList.add(
    "hidden"
  );


  resetSensorBase();


  startGame();

}


/* =========================================
   RESET SENSOR
========================================= */

function resetSensorBase(){

  if(
    currentAlpha !== null &&
    currentBeta !== null
  ){

    baseAlpha =
      currentAlpha;

    baseBeta =
      currentBeta;

  }

}


/* =========================================
   START GAME
========================================= */

function startGame(){

  stopGame();


  score = 0;

  combo = 0;

  lives = 3;

  time = 60;

  elapsed = 0;

  playing = true;


  updateHUD();


  /*
   * 最初の敵
   */

  for(
    let i=0;
    i<3;
    i++
  ){

    spawnEnemy();

  }


  /*
   * 敵追加
   */

  spawnTimer =
    setInterval(
      () => {

        if(!playing)
          return;


        let amount = 1;


        if(
          elapsed >= 20
        ){

          amount = 2;

        }


        if(
          elapsed >= 40
        ){

          amount = 3;

        }


        for(
          let i=0;
          i<amount;
          i++
        ){

          setTimeout(
            spawnEnemy,
            i * 180
          );

        }

      },
      1500
    );


  /*
   * 時間
   */

  timer =
    setInterval(
      () => {

        if(!playing)
          return;


        time--;

        elapsed++;


        if(time === 45){

          showBanner(
            "WAVE 2"
          );

        }


        if(time === 30){

          showBanner(
            "👑 BOSS"
          );

          spawnBoss();

        }


        if(time === 15){

          showBanner(
            "FINAL WAVE"
          );

        }


        updateHUD();


        if(time <= 0){

          endGame();

        }

      },
      1000
    );


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================
   SPAWN ENEMY
========================================= */

function spawnEnemy(){

  if(!playing)
    return;


  if(enemies.size >= 12)
    return;


  /*
   * 敵を「現在の画面」に固定するのではなく、
   * 空間上の角度に置く。
   *
   * yaw = 左右
   * pitch = 上下
   */

  const viewYaw =
    getViewYaw();

  const viewPitch =
    getViewPitch();


  /*
   * 今向いている方向から
   * 15〜55度離れたところに配置
   */

  const direction =
    Math.random() < .5
      ? -1
      : 1;


  const yaw =
    viewYaw +
    direction *
    (
      18 +
      Math.random() * 42
    );


  const pitch =
    viewPitch +
    (
      Math.random() * 44 -
      22
    );


  const enemyElement =
    document.createElement(
      "div"
    );


  enemyElement.className =
    "enemy";


  const body =
    document.createElement(
      "div"
    );


  body.className =
    "enemyBody";


  enemyElement.appendChild(
    body
  );


  field.appendChild(
    enemyElement
  );


  const enemy = {

    id:++enemyId,

    element:
      enemyElement,

    yaw,

    pitch,

    hp:1,

    boss:false,

    born:
      performance.now(),

    lifetime:
      6000 +
      Math.random() * 2500,

    depth:
      0

  };


  enemies.set(
    enemy.id,
    enemy
  );

}


/* =========================================
   BOSS
========================================= */

function spawnBoss(){

  if(!playing)
    return;


  const viewYaw =
    getViewYaw();

  const viewPitch =
    getViewPitch();


  const enemyElement =
    document.createElement(
      "div"
    );


  enemyElement.className =
    "enemy boss";


  const body =
    document.createElement(
      "div"
    );


  body.className =
    "enemyBody";


  enemyElement.appendChild(
    body
  );


  const hp =
    document.createElement(
      "div"
    );


  hp.className =
    "hp";


  const fill =
    document.createElement(
      "i"
    );


  hp.appendChild(fill);

  enemyElement.appendChild(
    hp
  );


  field.appendChild(
    enemyElement
  );


  const enemy = {

    id:++enemyId,

    element:
      enemyElement,

    yaw:
      viewYaw +
      (
        Math.random() < .5
          ? -1
          : 1
      ) * 25,

    pitch:
      viewPitch +
      (
        Math.random() * 30 -
        15
      ),

    hp:5,

    maxHp:5,

    hpFill:fill,

    boss:true,

    born:
      performance.now(),

    lifetime:10000,

    depth:0

  };


  enemies.set(
    enemy.id,
    enemy
  );

}


/* =========================================
   ENEMY SCREEN POSITION
========================================= */

/*
 * ここが今回の核心。
 *
 * 敵は「画面x/y」を持たない。
 *
 * 敵は
 *
 *   yaw   = 空間上の左右角度
 *   pitch = 空間上の上下角度
 *
 * を持っている。
 *
 * スマホを動かすと
 * viewYaw / viewPitch が変わる。
 *
 * その差から画面位置を計算する。
 */

function projectEnemy(
  enemy
){

  const w =
    window.innerWidth;

  const h =
    window.innerHeight;


  const viewYaw =
    getViewYaw();

  const viewPitch =
    getViewPitch();


  /*
   * 敵と現在のカメラ方向の角度差
   */

  const dxAngle =
    angleDifference(
      enemy.yaw,
      viewYaw
    );


  const dyAngle =
    enemy.pitch -
    viewPitch;


  /*
   * 仮想カメラの視野角
   */

  const FOV_X = 70;

  const FOV_Y = 55;


  /*
   * 角度 → 画面座標
   */

  const x =
    w / 2 +
    (
      dxAngle /
      FOV_X
    ) *
    w;


  const y =
    h / 2 +
    (
      dyAngle /
      FOV_Y
    ) *
    h;


  /*
   * 奥から手前へ
   */

  const age =
    performance.now() -
    enemy.born;


  const progress =
    Math.min(
      1,
      age /
      enemy.lifetime
    );


  /*
   * 少しずつ大きくなる
   */

  const scale =
    enemy.boss
      ? .65 +
        progress * .75
      : .45 +
        progress * 1.15;


  enemy.element.style.left =
    x + "px";


  enemy.element.style.top =
    y + "px";


  enemy.element.style.transform =
    "translate(-50%,-50%) " +
    "scale(" +
    scale +
    ")";


  /*
   * 画面外なら少し透明にする
   */

  const margin = 100;

  if(
    x < -margin ||
    x > w + margin ||
    y < -margin ||
    y > h + margin
  ){

    enemy.element.style.opacity =
      ".35";

  }else{

    enemy.element.style.opacity =
      "1";

  }


  return {
    x,
    y,
    scale
  };

}


/* =========================================
   FIND TARGET
========================================= */

function getTarget(){

  const cx =
    window.innerWidth / 2;

  const cy =
    window.innerHeight / 2;


  let target = null;

  let best = Infinity;


  enemies.forEach(
    enemy => {

      const pos =
        projectEnemy(
          enemy
        );


      const dx =
        pos.x - cx;

      const dy =
        pos.y - cy;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      /*
       * 照準内
       */

      const hitRadius =
        enemy.boss
          ? 95
          : 60;


      if(
        distance <=
        hitRadius
      ){

        if(
          distance < best
        ){

          best =
            distance;

          target =
            enemy;

        }

      }

    }
  );


  return target;

}


/* =========================================
   LOCK INDICATOR
========================================= */

function updateAim(){

  if(!playing){

    crosshair.classList.remove(
      "locked"
    );

    return;

  }


  const target =
    getTarget();


  if(target){

    crosshair.classList.add(
      "locked"
    );

  }else{

    crosshair.classList.remove(
      "locked"
    );

  }

}


/* =========================================
   ATTACK
========================================= */

function attackTarget(){

  if(!playing)
    return;


  /*
   * 連打しすぎ防止
   */

  const now =
    performance.now();


  if(
    now -
    lastShot <
    150
  ){

    return;

  }


  lastShot =
    now;


  const target =
    getTarget();


  if(!target){

    combo = 0;


    showHit(
      window.innerWidth / 2,
      window.innerHeight / 2,
      "MISS"
    );


    if(
      navigator.vibrate
    ){

      navigator.vibrate(15);

    }


    updateHUD();

    return;

  }


  target.hp--;


  combo++;


  const multiplier =
    Math.min(
      10,
      Math.max(
        1,
        combo
      )
    );


  /*
   * まだ生きている
   */

  if(
    target.hp > 0
  ){

    score +=
      100 *
      multiplier;


    const pos =
      projectEnemy(
        target
      );


    showHit(
      pos.x,
      pos.y,
      "HIT!"
    );


    if(target.hpFill){

      target.hpFill.style.width =
        (
          target.hp /
          target.maxHp *
          100
        ) + "%";

    }


    if(
      navigator.vibrate
    ){

      navigator.vibrate(25);

    }


    updateHUD();

    return;

  }


  /*
   * 撃破
   */

  const points =
    target.boss
      ? 3000 * multiplier
      : 150 * multiplier;


  score += points;


  const pos =
    projectEnemy(
      target
    );


  showHit(
    pos.x,
    pos.y,
    "+" + points
  );


  explode(
    pos.x,
    pos.y,
    target.boss
      ? 150
      : 80
  );


  target.element.remove();


  enemies.delete(
    target.id
  );


  if(target.boss){

    showBanner(
      "💥 BOSS DOWN!"
    );

  }


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      target.boss
        ? [50,30,100]
        : 30
    );

  }


  updateHUD();

}


/* =========================================
   GAME LOOP
========================================= */

function gameLoop(
  timestamp
){

  if(!playing)
    return;


  /*
   * 敵を更新
   */

  enemies.forEach(
    enemy => {

      const age =
        timestamp -
        enemy.born;


      /*
       * 敵が時間切れ
       */

      if(
        age >
        enemy.lifetime
      ){

        enemy.element.remove();

        enemies.delete(
          enemy.id
        );


        /*
         * 逃した
         */

        lives--;

        combo = 0;


        updateHUD();


        if(
          lives <= 0
        ){

          endGame();

        }


        return;

      }


      projectEnemy(
        enemy
      );

    }
  );


  /*
   * 照準のロック状態
   */

  updateAim();


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================
   HUD
========================================= */

function updateHUD(){

  scoreEl.textContent =
    score.toLocaleString();

  comboEl.textContent =
    "COMBO ×" +
    Math.max(
      1,
      combo
    );

  timeEl.textContent =
    time;

  livesEl.textContent =
    "❤️".repeat(lives) +
    "🖤".repeat(
      3 - lives
    );

}


/* =========================================
   HIT
========================================= */

function showHit(
  x,
  y,
  text
){

  const el =
    document.createElement(
      "div"
    );


  el.className =
    "hit";


  el.textContent =
    text;


  el.style.left =
    x + "px";


  el.style.top =
    y + "px";


  field.appendChild(
    el
  );


  setTimeout(
    () =>
      el.remove(),
    650
  );

}


/* =========================================
   EXPLOSION
========================================= */

function explode(
  x,
  y,
  size
){

  const el =
    document.createElement(
      "div"
    );


  el.className =
    "explosion";


  el.style.left =
    x + "px";


  el.style.top =
    y + "px";


  el.style.width =
    size + "px";


  el.style.height =
    size + "px";


  field.appendChild(
    el
  );


  setTimeout(
    () =>
      el.remove(),
    500
  );

}


/* =========================================
   BANNER
========================================= */

let bannerTimeout = null;


function showBanner(
  text
){

  banner.textContent =
    text;

  banner.style.opacity =
    "1";


  clearTimeout(
    bannerTimeout
  );


  bannerTimeout =
    setTimeout(
      () => {

        banner.style.opacity =
          "0";

      },
      1100
    );

}


/* =========================================
   GAME OVER
========================================= */

function endGame(){

  if(!playing)
    return;


  playing = false;


  stopGame();


  finalScore.textContent =
    score.toLocaleString();


  rankEl.textContent =
    getRank(score);


  gameOver.classList.remove(
    "hidden"
  );


  saveHighScore();

}


function stopGame(){

  clearInterval(
    timer
  );

  clearInterval(
    spawnTimer
  );


  timer = null;

  spawnTimer = null;


  enemies.forEach(
    enemy =>
      enemy.element.remove()
  );


  enemies.clear();

}


/* =========================================
   RANK
========================================= */

function getRank(
  value
){

  if(value >= 20000)
    return "RANK S";

  if(value >= 12000)
    return "RANK A";

  if(value >= 7000)
    return "RANK B";

  if(value >= 3000)
    return "RANK C";

  return "RANK D";

}


/* =========================================
   HIGH SCORE
========================================= */

function saveHighScore(){

  const old =
    Number(
      localStorage.getItem(
        "cameraHunterBest"
      ) || 0
    );


  if(
    score > old
  ){

    localStorage.setItem(
      "cameraHunterBest",
      score
    );

  }

}


/* =========================================
   BUTTONS
========================================= */

startButton.addEventListener(
  "click",
  prepareGame
);


sensorRetry.addEventListener(
  "click",
  () => {

    sensorError.classList.add(
      "hidden"
    );

    prepareGame();

  }
);


cameraRetry.addEventListener(
  "click",
  prepareGame
);


/*
 * ★ 攻撃はATTACKボタンのみ
 */

attack.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    event.stopPropagation();

    attackTarget();

  },
  {
    passive:false
  }
);


retryButton.addEventListener(
  "click",
  () => {

    gameOver.classList.add(
      "hidden"
    );

    resetSensorBase();

    startGame();

  }
);


stopButton.addEventListener(
  "click",
  () => {

    playing = false;

    stopGame();

    stopCamera();

    gameOver.classList.add(
      "hidden"
    );

    start.classList.remove(
      "hidden"
    );

  }
);


/* =========================================
   MOBILE ZOOM PREVENTION
========================================= */

function noZoom(event){

  event.preventDefault();

}


document.addEventListener(
  "dblclick",
  noZoom,
  {
    passive:false
  }
);

document.addEventListener(
  "gesturestart",
  noZoom,
  {
    passive:false
  }
);

document.addEventListener(
  "gesturechange",
  noZoom,
  {
    passive:false
  }
);

document.addEventListener(
  "gestureend",
  noZoom,
  {
    passive:false
  }
);


/*
 * 画面のタッチでは何もしない
 */

document.addEventListener(
  "touchstart",
  event => {

    if(
      !event.target.closest(
        "button"
      )
    ){

      event.preventDefault();

    }

  },
  {
    passive:false
  }
);


updateHUD();

</script>
