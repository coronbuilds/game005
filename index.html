<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>CAMERA HUNTER TEST</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#000;
}

#camera{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

#info{
  position:absolute;
  z-index:20;
  top:calc(env(safe-area-inset-top) + 12px);
  left:12px;
  right:12px;
  color:#fff;
  font-weight:900;
  text-shadow:0 2px 6px #000;
}

#title{
  font-size:20px;
}

#heading{
  margin-top:5px;
  font-size:25px;
}

#status{
  margin-top:6px;
  font-size:14px;
  color:#ffe600;
}

#crosshair{
  position:absolute;
  z-index:30;
  left:50%;
  top:50%;
  width:110px;
  height:110px;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

#crosshair .circle{
  position:absolute;
  inset:10px;
  border:3px solid white;
  border-radius:50%;
}

#crosshair .horizontal{
  position:absolute;
  left:0;
  top:54px;
  width:110px;
  height:2px;
  background:white;
}

#crosshair .vertical{
  position:absolute;
  left:54px;
  top:0;
  width:2px;
  height:110px;
  background:white;
}

#crosshair .dot{
  position:absolute;
  left:50%;
  top:50%;
  width:7px;
  height:7px;
  transform:translate(-50%,-50%);
  background:red;
  border-radius:50%;
}


/* =========================
   敵
========================= */

#enemy{
  position:absolute;

  z-index:25;

  left:50%;
  top:50%;

  width:90px;
  height:90px;

  transform:translate(-50%,-50%);

  display:block;

  border:4px solid white;
  border-radius:50%;

  background:
    radial-gradient(
      circle at 32% 32%,
      white 0 5%,
      transparent 6%
    ),
    radial-gradient(
      circle at 68% 32%,
      white 0 5%,
      transparent 6%
    ),
    radial-gradient(
      circle at 32% 32%,
      red 0 14%,
      transparent 15%
    ),
    radial-gradient(
      circle at 68% 32%,
      red 0 14%,
      transparent 15%
    ),
    radial-gradient(
      circle at 50% 68%,
      #111 0 18%,
      transparent 19%
    ),
    linear-gradient(
      #ff2020,
      #700000
    );

  box-shadow:
    0 0 20px red,
    0 0 50px red;

  pointer-events:none;
}


/* =========================
   START
========================= */

#start{
  position:absolute;
  z-index:100;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.88);
}

#startPanel{
  width:90%;
  max-width:400px;
  text-align:center;
  color:white;
}

#startPanel h1{
  margin:0 0 15px;
  font-size:40px;
  line-height:.9;
}

#startPanel p{
  color:#ddd;
  line-height:1.7;
}

#startButton{
  width:100%;
  height:70px;

  border:0;
  border-radius:18px;

  background:#e00000;
  color:white;

  font-size:21px;
  font-weight:900;

  box-shadow:
    0 6px 0 #600000;

  touch-action:manipulation;
}

#startButton:active{
  transform:translateY(5px);
}

.hidden{
  display:none !important;
}
</style>
</head>


<body>

<div id="game">

  <video
    id="camera"
    autoplay
    muted
    playsinline>
  </video>


  <div id="info">

    <div id="title">
      CAMERA HUNTER TEST
    </div>

    <div id="heading">
      方位：---
    </div>

    <div id="status">
      STARTを押してください
    </div>

  </div>


  <div id="crosshair">

    <div class="circle"></div>

    <div class="horizontal"></div>

    <div class="vertical"></div>

    <div class="dot"></div>

  </div>


  <!-- 敵 -->

  <div id="enemy"></div>


  <!-- START画面 -->

  <div id="start">

    <div id="startPanel">

      <h1>
        CAMERA<br>
        HUNTER
      </h1>

      <p>
        スマホを動かして<br>
        敵を探すテストです。
      </p>

      <button id="startButton">
        📷 START
      </button>

    </div>

  </div>

</div>


<script>

"use strict";


/* =========================
   DOM
========================= */

const camera =
  document.getElementById("camera");

const enemy =
  document.getElementById("enemy");

const start =
  document.getElementById("start");

const startButton =
  document.getElementById("startButton");

const headingText =
  document.getElementById("heading");

const status =
  document.getElementById("status");


/* =========================
   CAMERA
========================= */

let stream = null;

async function startCamera(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    return false;
  }

  try{

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:"environment"
            }
          },

          audio:false

        });


    camera.srcObject =
      stream;


    await camera.play();


    return true;

  }catch(error){

    console.log(
      "Camera error:",
      error
    );

    return false;

  }

}


/* =========================
   SENSOR
========================= */

let heading = null;

let sensorStarted = false;


function normalize(value){

  value =
    value % 360;

  if(value < 0){

    value += 360;

  }

  return value;

}


function orientationHandler(event){

  let value = null;


  /*
   * iPhone Safari
   * コンパスを最優先
   */

  if(
    typeof event.webkitCompassHeading ===
    "number" &&
    event.webkitCompassHeading !== 0
  ){

    value =
      event.webkitCompassHeading;

  }
  else if(
    typeof event.alpha ===
    "number"
  ){

    value =
      event.alpha;

  }


  if(value === null){

    return;

  }


  heading =
    normalize(value);


  headingText.textContent =
    "方位：" +
    heading.toFixed(1) +
    "°";


  sensorStarted = true;

}


async function startSensor(){

  if(
    typeof DeviceOrientationEvent ===
    "undefined"
  ){

    return false;

  }


  try{

    /*
     * iPhone
     */

    if(
      typeof DeviceOrientationEvent
        .requestPermission ===
      "function"
    ){

      const permission =
        await DeviceOrientationEvent
          .requestPermission();


      if(
        permission !== "granted"
      ){

        return false;

      }

    }


    window.addEventListener(
      "deviceorientation",
      orientationHandler,
      true
    );


    window.addEventListener(
      "deviceorientationabsolute",
      orientationHandler,
      true
    );


    return true;

  }catch(error){

    console.log(
      "Sensor error:",
      error
    );

    return false;

  }

}


/* =========================
   敵
========================= */


/*
 * 敵は「東」に固定。
 *
 * 重要：
 * この値はゲーム中変えない。
 */

const enemyHeading = 90;


function updateEnemy(){

  /*
   * センサーがまだ取れていない
   *
   * → 敵は中央
   */

  if(heading === null){

    enemy.style.display =
      "block";

    enemy.style.left =
      "50%";

    enemy.style.top =
      "50%";

    return;

  }


  /*
   * 敵の絶対方位
   * -
   * スマホの現在方位
   */

  let difference =
    enemyHeading -
    heading;


  /*
   * -180〜180
   */

  while(
    difference > 180
  ){

    difference -= 360;

  }


  while(
    difference < -180
  ){

    difference += 360;

  }


  /*
   * 画面横方向へ変換
   */

  const FOV = 70;


  const x =
    window.innerWidth / 2 +
    (
      difference /
      FOV
    ) *
    window.innerWidth;


  /*
   * 敵は中央の高さ
   */

  const y =
    window.innerHeight / 2;


  enemy.style.display =
    "block";


  enemy.style.left =
    x + "px";


  enemy.style.top =
    y + "px";


  status.textContent =
    "敵：東 90° / 現在：" +
    heading.toFixed(1) +
    "° / 差：" +
    difference.toFixed(1) +
    "°";

}


/* =========================
   LOOP
========================= */

function loop(){

  updateEnemy();

  requestAnimationFrame(
    loop
  );

}


/* =========================
   START
========================= */

startButton.addEventListener(
  "click",
  async function(event){

    event.preventDefault();


    startButton.disabled =
      true;


    status.textContent =
      "起動中…";


    /*
     * ★★★
     *
     * 先にSTART画面を消す。
     * センサーやカメラが失敗しても
     * 敵は表示する。
     *
     * ★★★
     */

    start.classList.add(
      "hidden"
    );


    /*
     * 敵を強制表示
     */

    enemy.style.display =
      "block";

    enemy.style.left =
      "50%";

    enemy.style.top =
      "50%";


    /*
     * カメラ
     */

    const cameraOK =
      await startCamera();


    /*
     * センサー
     */

    const sensorOK =
      await startSensor();


    /*
     * センサーがなくてもゲーム開始
     */

    if(cameraOK){

      status.textContent =
        "🔴 敵が出ています";

    }else{

      status.textContent =
        "🔴 敵が出ています（カメラなし）";

    }


    if(!sensorOK){

      status.textContent +=
        " / センサー待機中";

    }


    requestAnimationFrame(
      loop
    );

  },
  {
    passive:false
  }
);


/* =========================
   iPhoneズーム防止
========================= */

document.addEventListener(
  "dblclick",
  function(e){

    e.preventDefault();

  },
  {
    passive:false
  }
);

document.addEventListener(
  "gesturestart",
  function(e){

    e.preventDefault();

  },
  {
    passive:false
  }
);

document.addEventListener(
  "gesturechange",
  function(e){

    e.preventDefault();

  },
  {
    passive:false
  }
);

document.addEventListener(
  "gestureend",
  function(e){

    e.preventDefault();

  },
  {
    passive:false
  }
);


/*
 * 最初から敵を表示状態にする。
 *
 * START前はSTART画面で隠れているので
 * 実際には見えない。
 */

enemy.style.display =
  "block";

</script>

</body>
</html>
