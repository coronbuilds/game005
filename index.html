<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      minimum-scale=1,
      user-scalable=no">

<title>REAL WORLD HUNTER</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070b;
  touch-action:none;
}

body{
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(
      ellipse at center,
      #18202d 0%,
      #070a10 65%,
      #020304 100%
    );
}

/* 空間 */

#world{
  position:absolute;
  inset:0;
  overflow:hidden;
  perspective:700px;
}

/* 星 */

.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  opacity:.5;
  border-radius:50%;
}

/* 地面 */

#ground{
  position:absolute;
  left:-100%;
  top:62%;
  width:300%;
  height:100%;
  background:
    linear-gradient(
      rgba(0,255,180,.08) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(0,255,180,.08) 1px,
      transparent 1px
    );
  background-size:50px 50px;
  transform:
    perspective(400px)
    rotateX(65deg);
  transform-origin:center top;
  opacity:.7;
}

/* 方角 */

#direction{
  position:absolute;
  top:105px;
  left:50%;
  transform:translateX(-50%);
  color:#7fffd4;
  font-size:13px;
  z-index:20;
  text-shadow:0 0 8px #00ffb3;
}

/* HUD */

#hud{
  position:absolute;
  top:0;
  left:0;
  right:0;
  padding:
    calc(env(safe-area-inset-top) + 12px)
    15px 0;
  z-index:30;
  color:white;
  text-shadow:0 2px 5px #000;
}

#hudTop{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  font-size:16px;
}

#status{
  text-align:center;
  margin-top:8px;
  font-size:12px;
  opacity:.85;
}

/* 照準 */

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:80px;
  height:80px;
  transform:translate(-50%,-50%);
  z-index:25;
  pointer-events:none;
}

#crosshair::before{
  content:"";
  position:absolute;
  left:39px;
  top:0;
  width:2px;
  height:80px;
  background:#00ff9d;
  box-shadow:0 0 10px #00ff9d;
}

#crosshair::after{
  content:"";
  position:absolute;
  left:0;
  top:39px;
  width:80px;
  height:2px;
  background:#00ff9d;
  box-shadow:0 0 10px #00ff9d;
}

#crossDot{
  position:absolute;
  left:50%;
  top:50%;
  width:7px;
  height:7px;
  transform:translate(-50%,-50%);
  background:#00ff9d;
  border-radius:50%;
  box-shadow:0 0 12px #00ff9d;
}

/* 敵 */

.enemy{
  position:absolute;
  left:50%;
  top:50%;
  width:90px;
  height:90px;
  transform:translate(-50%,-50%);
  display:none;
  z-index:22;
  pointer-events:none;
}

.enemyBody{
  position:absolute;
  left:13px;
  top:13px;
  width:64px;
  height:64px;
  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #ffaaaa,
      #ff2525 40%,
      #720000 80%
    );

  border:3px solid white;

  box-shadow:
    0 0 15px red,
    0 0 35px rgba(255,0,0,.7);
}

.enemyEye{
  position:absolute;
  top:32px;
  width:9px;
  height:13px;
  border-radius:50%;
  background:#000;
}

.enemyEye.left{
  left:29px;
}

.enemyEye.right{
  right:29px;
}

.enemyMouth{
  position:absolute;
  left:32px;
  top:49px;
  width:25px;
  height:9px;
  border-bottom:4px solid black;
  border-radius:50%;
}

/* 距離表示 */

#enemyDistance{
  position:absolute;
  left:50%;
  top:calc(50% + 65px);
  transform:translateX(-50%);
  color:white;
  font-size:12px;
  text-shadow:0 0 6px black;
  z-index:23;
  display:none;
}

/* 攻撃 */

#attack{
  position:absolute;
  left:50%;
  bottom:
    calc(env(safe-area-inset-bottom) + 22px);
  transform:translateX(-50%);

  width:180px;
  height:70px;

  border:3px solid white;
  border-radius:40px;

  background:
    linear-gradient(
      #e00000,
      #780000
    );

  color:white;
  font-size:24px;
  font-weight:900;

  z-index:40;
  touch-action:none;
}

#attack:active{
  transform:
    translateX(-50%)
    scale(.94);
}

/* ヒット */

#hit{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);

  color:white;
  font-size:55px;
  font-weight:1000;

  text-shadow:
    0 0 10px red,
    0 0 30px red;

  display:none;
  z-index:50;
}

/* START */

#startScreen{
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle,
      #151d29,
      #020305 75%
    );

  z-index:100;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  color:white;
  text-align:center;
}

#title{
  font-size:39px;
  font-weight:1000;
  letter-spacing:4px;

  text-shadow:
    0 0 12px #00ff9d,
    0 0 30px #00ff9d;
}

#sub{
  margin-top:18px;
  font-size:14px;
  line-height:1.8;
  opacity:.85;
}

#startButton{
  margin-top:32px;

  width:220px;
  height:70px;

  border:3px solid white;
  border-radius:40px;

  background:#00a86b;
  color:white;

  font-size:25px;
  font-weight:900;

  touch-action:none;
}

#startButton:active{
  transform:scale(.94);
}

/* メッセージ */

#message{
  position:absolute;
  left:50%;
  top:65%;
  transform:translate(-50%,-50%);

  width:85%;

  padding:15px;

  color:white;
  text-align:center;

  background:rgba(0,0,0,.7);
  border:1px solid rgba(255,255,255,.2);
  border-radius:12px;

  z-index:60;
  display:none;
}
</style>
</head>

<body>

<div id="game">

  <div id="world">

    <div id="ground"></div>

    <div class="star" style="left:8%;top:20%"></div>
    <div class="star" style="left:17%;top:35%"></div>
    <div class="star" style="left:28%;top:15%"></div>
    <div class="star" style="left:42%;top:25%"></div>
    <div class="star" style="left:56%;top:13%"></div>
    <div class="star" style="left:71%;top:29%"></div>
    <div class="star" style="left:84%;top:18%"></div>
    <div class="star" style="left:93%;top:40%"></div>

  </div>

  <div id="hud">

    <div id="hudTop">
      <div>
        SCORE:
        <span id="score">0</span>
      </div>

      <div>
        COMBO:
        <span id="combo">0</span>
      </div>
    </div>

    <div id="status">
      STARTしてください
    </div>

  </div>

  <div id="direction">
    N
  </div>

  <div id="crosshair">
    <div id="crossDot"></div>
  </div>

  <div id="enemy">

    <div class="enemyBody"></div>

    <div class="enemyEye left"></div>
    <div class="enemyEye right"></div>

    <div class="enemyMouth"></div>

  </div>

  <div id="enemyDistance">
    0m
  </div>

  <div id="hit">
    HIT!
  </div>

  <div id="message"></div>

  <button id="attack">
    🔥 ATTACK
  </button>

  <div id="startScreen">

    <div id="title">
      REAL WORLD<br>
      HUNTER
    </div>

    <div id="sub">
      現実の世界に重なる<br>
      もう一つのゲーム世界<br><br>

      📍 GPSで場所を取得<br>
      🧭 スマホの向きで視点を操作<br>
      👾 空間に固定された敵を狙え
    </div>

    <button id="startButton">
      START
    </button>

  </div>

</div>

<script>

/* =========================
   DOM
========================= */

const startScreen =
  document.getElementById("startScreen");

const startButton =
  document.getElementById("startButton");

const attackButton =
  document.getElementById("attack");

const enemy =
  document.getElementById("enemy");

const enemyDistance =
  document.getElementById("enemyDistance");

const scoreElement =
  document.getElementById("score");

const comboElement =
  document.getElementById("combo");

const statusElement =
  document.getElementById("status");

const directionElement =
  document.getElementById("direction");

const hitElement =
  document.getElementById("hit");

const messageElement =
  document.getElementById("message");


/* =========================
   GAME
========================= */

let playing = false;

let score = 0;
let combo = 0;


/* =========================
   PLAYER
========================= */

let playerLat = null;
let playerLon = null;

let heading = null;


/* =========================
   ENEMY
========================= */

/*
  敵はGPS座標を持つ。

  これは画面座標ではない。
*/

let enemyLat = null;
let enemyLon = null;


/*
  敵の高度。
  今回は簡易的に0。
*/

let enemyHeight = 0;


/* =========================
   ANGLE
========================= */

function normalizeAngle(angle){

  while(angle > 180){
    angle -= 360;
  }

  while(angle < -180){
    angle += 360;
  }

  return angle;
}


/* =========================
   DISTANCE
========================= */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const dp =
    (lat2-lat1) *
    Math.PI / 180;

  const dl =
    (lon2-lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dp/2) *
    Math.sin(dp/2) +

    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dl/2) *
    Math.sin(dl/2);

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

  return R*c;
}


/* =========================
   BEARING
========================= */

function bearing(
  lat1,
  lon1,
  lat2,
  lon2
){

  const p1 =
    lat1 *
    Math.PI / 180;

  const p2 =
    lat2 *
    Math.PI / 180;

  const dl =
    (lon2-lon1) *
    Math.PI / 180;

  const y =
    Math.sin(dl) *
    Math.cos(p2);

  const x =
    Math.cos(p1) *
    Math.sin(p2) -

    Math.sin(p1) *
    Math.cos(p2) *
    Math.cos(dl);

  let angle =
    Math.atan2(y,x) *
    180 /
    Math.PI;

  angle =
    (angle + 360) % 360;

  return angle;
}


/* =========================
   GPS
========================= */

function startGPS(){

  if(!navigator.geolocation){

    statusElement.textContent =
      "GPSが使用できません";

    return;

  }


  navigator.geolocation.watchPosition(

    function(position){

      playerLat =
        position.coords.latitude;

      playerLon =
        position.coords.longitude;


      statusElement.textContent =
        "📍 GPS取得OK";


      /*
        初回GPS取得時だけ
        敵を生成する。
      */

      if(enemyLat === null){

        createEnemy();

      }

    },

    function(error){

      console.log(error);

      messageElement.style.display =
        "block";

      messageElement.textContent =
        "GPSを許可してください";

    },

    {
      enableHighAccuracy:true,
      maximumAge:1000,
      timeout:10000
    }

  );

}


/* =========================
   SENSOR
========================= */

async function startSensor(){

  /*
    iPhone Safari
  */

  if(
    typeof DeviceOrientationEvent !==
    "undefined" &&

    typeof DeviceOrientationEvent
      .requestPermission ===
      "function"
  ){

    try{

      const result =
        await DeviceOrientationEvent
          .requestPermission();

      if(result !== "granted"){

        statusElement.textContent =
          "🧭 センサー許可が必要";

        return;

      }

    }catch(error){

      console.log(error);

    }

  }


  window.addEventListener(
    "deviceorientation",
    handleOrientation,
    true
  );

}


/* =========================
   ORIENTATION
========================= */

function handleOrientation(event){

  /*
    iPhone Safari
    コンパス値
  */

  if(
    typeof event.webkitCompassHeading ===
    "number" &&
    !isNaN(event.webkitCompassHeading)
  ){

    heading =
      event.webkitCompassHeading;

  }


  if(heading !== null){

    directionElement.textContent =
      getDirectionName(heading);

  }

}


/* =========================
   DIRECTION NAME
========================= */

function getDirectionName(deg){

  const dirs = [
    "N",
    "NE",
    "E",
    "SE",
    "S",
    "SW",
    "W",
    "NW"
  ];

  const index =
    Math.round(deg / 45) % 8;

  return dirs[index];

}


/* =========================
   CREATE ENEMY
========================= */

function createEnemy(){

  if(
    playerLat === null ||
    playerLon === null
  ){
    return;
  }


  /*
    現在地から
    約50m先に敵を置く。

    ★一度決めたら
    その座標は変わらない。
  */

  const enemyBearing =
    heading !== null
      ? heading + 25
      : 0;

  const distance = 50;


  const latOffset =
    Math.cos(
      enemyBearing *
      Math.PI / 180
    ) *
    distance /
    111320;


  const lonOffset =
    Math.sin(
      enemyBearing *
      Math.PI / 180
    ) *
    distance /
    (
      111320 *
      Math.cos(
        playerLat *
        Math.PI / 180
      )
    );


  enemyLat =
    playerLat +
    latOffset;

  enemyLon =
    playerLon +
    lonOffset;


  enemy.style.display =
    "block";

  enemyDistance.style.display =
    "block";

}


/* =========================
   UPDATE ENEMY
========================= */

function updateEnemy(){

  if(
    !playing ||
    playerLat === null ||
    playerLon === null ||
    enemyLat === null ||
    enemyLon === null
  ){
    return;
  }


  /*
    敵までの距離
  */

  const distance =
    distanceMeters(
      playerLat,
      playerLon,
      enemyLat,
      enemyLon
    );


  /*
    敵の方向
  */

  const targetBearing =
    bearing(
      playerLat,
      playerLon,
      enemyLat,
      enemyLon
    );


  enemyDistance.textContent =
    Math.round(distance) +
    "m";


  /*
    カメラの向きとの差
  */

  if(heading === null){

    enemy.style.left =
      "50%";

    enemy.style.top =
      "50%";

    return;

  }


  const diff =
    normalizeAngle(
      targetBearing -
      heading
    );


  /*
    視野角
  */

  const FOV = 70;


  const x =
    50 +
    (diff / FOV) * 50;


  /*
    距離によって大きさを変える。

    近いほど大きい。
  */

  const scale =
    Math.max(
      .45,
      Math.min(
        2.5,
        60 / Math.max(distance,10)
      )
    );


  if(
    x > -30 &&
    x < 130
  ){

    enemy.style.display =
      "block";

    enemy.style.left =
      x + "%";

    enemy.style.top =
      "48%";

    enemy.style.transform =
      "translate(-50%,-50%) scale(" +
      scale +
      ")";

    enemyDistance.style.display =
      "block";

    enemyDistance.style.left =
      x + "%";

  }else{

    /*
      画面外でも
      敵そのものは消滅していない。

      空間には存在し続ける。
    */

    enemy.style.display =
      "none";

    enemyDistance.style.display =
      "none";

  }

}


/* =========================
   ATTACK
========================= */

function attack(){

  if(!playing){
    return;
  }


  if(
    enemy.style.display ===
    "none"
  ){

    combo = 0;

    comboElement.textContent =
      combo;

    return;

  }


  const rect =
    enemy.getBoundingClientRect();


  const centerX =
    window.innerWidth / 2;

  const centerY =
    window.innerHeight / 2;


  const enemyX =
    rect.left +
    rect.width / 2;

  const enemyY =
    rect.top +
    rect.height / 2;


  const dx =
    enemyX - centerX;

  const dy =
    enemyY - centerY;


  const distance =
    Math.sqrt(
      dx*dx +
      dy*dy
    );


  if(distance < 90){

    score +=
      100 +
      combo * 25;

    combo++;


    scoreElement.textContent =
      score;

    comboElement.textContent =
      combo;


    hitElement.style.display =
      "block";


    if(navigator.vibrate){

      navigator.vibrate(
        [40,30,80]
      );

    }


    setTimeout(
      ()=>{
        hitElement.style.display =
          "none";
      },
      200
    );


    /*
      敵を新しい世界座標へ。

      プレイヤーから
      50〜100m先。
    */

    respawnEnemy();

  }else{

    combo = 0;

    comboElement.textContent =
      combo;

  }

}


/* =========================
   RESPAWN
========================= */

function respawnEnemy(){

  if(
    playerLat === null ||
    playerLon === null
  ){
    return;
  }


  const offset =
    heading !== null
      ? heading +
        (
          Math.random()*100 -
          50
        )
      : 0;


  const distance =
    50 +
    Math.random()*50;


  const latOffset =
    Math.cos(
      offset *
      Math.PI / 180
    ) *
    distance /
    111320;


  const lonOffset =
    Math.sin(
      offset *
      Math.PI / 180
    ) *
    distance /
    (
      111320 *
      Math.cos(
        playerLat *
        Math.PI / 180
      )
    );


  /*
    ★ここで決定した座標は
    プレイヤーが動いても変わらない。
  */

  enemyLat =
    playerLat +
    latOffset;

  enemyLon =
    playerLon +
    lonOffset;

}


/* =========================
   LOOP
========================= */

function loop(){

  updateEnemy();

  requestAnimationFrame(
    loop
  );

}


/* =========================
   START
========================= */

startButton.addEventListener(
  "click",
  async function(e){

    e.preventDefault();


    /*
      ★STARTは最初に消す
    */

    startScreen.style.display =
      "none";


    playing = true;


    score = 0;
    combo = 0;


    scoreElement.textContent =
      "0";

    comboElement.textContent =
      "0";


    statusElement.textContent =
      "📍 GPS・センサー起動中";


    /*
      GPS
    */

    startGPS();


    /*
      センサー
    */

    await startSensor();


    /*
      ループ
    */

    requestAnimationFrame(
      loop
    );

  },
  {
    passive:false
  }
);


/* =========================
   ATTACK
========================= */

attackButton.addEventListener(
  "touchstart",
  function(e){

    e.preventDefault();

    attack();

  },
  {
    passive:false
  }
);


attackButton.addEventListener(
  "click",
  function(e){

    e.preventDefault();

    attack();

  }
);


/* =========================
   MOBILE
========================= */

document.addEventListener(
  "contextmenu",
  e => e.preventDefault()
);

document.addEventListener(
  "selectstart",
  e => e.preventDefault()
);

document.addEventListener(
  "gesturestart",
  e => e.preventDefault()
);

document.addEventListener(
  "dblclick",
  e => e.preventDefault()
);

</script>

</body>
</html>
