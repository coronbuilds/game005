<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>CAMERA HUNTER</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;

  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;

  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;

  touch-action:none;
}

body{
  position:fixed;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#000;
}

#camera{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  pointer-events:none;
}

#field{
  position:absolute;
  inset:0;

  overflow:hidden;

  pointer-events:none;
}


/* =========================
 HUD
========================= */

#hud{
  position:absolute;
  z-index:20;

  top:0;
  left:0;
  right:0;

  padding:
    calc(env(safe-area-inset-top) + 12px)
    15px;

  display:flex;
  justify-content:space-between;

  color:white;

  font-weight:900;

  text-shadow:
    0 2px 5px #000;

  pointer-events:none;
}

.scoreTitle{
  font-size:12px;
}

#score{
  font-size:28px;
}

#combo{
  margin-top:2px;

  color:#ffe600;

  font-size:14px;
}

#time{
  font-size:28px;
}

#lives{
  font-size:18px;

  text-align:right;
}


/* =========================
 CROSSHAIR
========================= */

#crosshair{
  position:absolute;
  z-index:30;

  left:50%;
  top:50%;

  width:110px;
  height:110px;

  transform:translate(-50%,-50%);

  pointer-events:none;
}

.crossRing{
  position:absolute;

  left:10px;
  top:10px;

  width:90px;
  height:90px;

  border:
    3px solid rgba(255,255,255,.9);

  border-radius:50%;

  box-shadow:
    0 0 8px #000;
}

.crossH{
  position:absolute;

  left:0;
  top:54px;

  width:110px;
  height:2px;

  background:white;

  box-shadow:
    0 0 5px #000;
}

.crossV{
  position:absolute;

  left:54px;
  top:0;

  width:2px;
  height:110px;

  background:white;

  box-shadow:
    0 0 5px #000;
}

.crossDot{
  position:absolute;

  left:50%;
  top:50%;

  width:7px;
  height:7px;

  transform:translate(-50%,-50%);

  background:#ff2020;

  border-radius:50%;
}

#crosshair.lock{
  filter:
    drop-shadow(0 0 10px red);
}

#crosshair.lock .crossRing{
  border-color:#ff2222;
}


/* =========================
 ENEMY
========================= */

.enemy{
  position:absolute;

  width:78px;
  height:78px;

  transform:
    translate(-50%,-50%);

  pointer-events:none;
}

.enemyBody{
  width:100%;
  height:100%;

  border:
    3px solid white;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 34%,
      white 0 5%,
      transparent 6%
    ),
    radial-gradient(
      circle at 65% 34%,
      white 0 5%,
      transparent 6%
    ),
    radial-gradient(
      circle at 35% 34%,
      red 0 13%,
      transparent 14%
    ),
    radial-gradient(
      circle at 65% 34%,
      red 0 13%,
      transparent 14%
    ),
    radial-gradient(
      circle at 50% 68%,
      #111 0 18%,
      transparent 19%
    ),
    linear-gradient(
      145deg,
      #ff3030,
      #550000
    );

  box-shadow:
    0 0 15px red,
    0 0 35px rgba(255,0,0,.8);
}

.enemy.boss{
  width:145px;
  height:145px;
}

.enemy.boss .enemyBody{
  border-width:5px;

  box-shadow:
    0 0 25px red,
    0 0 70px red;
}

.hp{
  position:absolute;

  left:50%;
  top:-15px;

  width:100%;
  height:8px;

  transform:translateX(-50%);

  border:1px solid white;

  background:#111;

  border-radius:10px;

  overflow:hidden;
}

.hpBar{
  width:100%;
  height:100%;

  background:#32ff45;
}


/* =========================
 ATTACK
========================= */

#attack{
  position:absolute;
  z-index:40;

  left:50%;

  bottom:
    calc(env(safe-area-inset-bottom) + 20px);

  transform:translateX(-50%);

  width:190px;
  height:72px;

  border:
    3px solid white;

  border-radius:40px;

  background:
    linear-gradient(
      #ff3030,
      #a00000
    );

  color:white;

  font-size:23px;
  font-weight:1000;

  letter-spacing:2px;

  box-shadow:
    0 6px 0 #520000,
    0 0 25px rgba(255,0,0,.7);

  touch-action:manipulation;
}

#attack:active{
  transform:
    translateX(-50%)
    translateY(5px);
}


/* =========================
 EFFECT
========================= */

.hitText{
  position:absolute;

  z-index:100;

  transform:
    translate(-50%,-50%);

  color:white;

  font-size:28px;
  font-weight:1000;

  text-shadow:
    0 0 10px red,
    0 2px 5px black;

  animation:
    hitAnimation .55s forwards;
}

@keyframes hitAnimation{
  from{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(.7);
  }

  to{
    opacity:0;

    transform:
      translate(-50%,-120px)
      scale(1.4);
  }
}


.explosion{
  position:absolute;

  z-index:90;

  transform:
    translate(-50%,-50%);

  border:
    4px solid white;

  border-radius:50%;

  animation:
    explosionAnimation .45s forwards;
}

@keyframes explosionAnimation{
  from{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(.2);
  }

  to{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(4);
  }
}


/* =========================
 BANNER
========================= */

#banner{
  position:absolute;

  z-index:150;

  left:50%;
  top:28%;

  transform:
    translate(-50%,-50%);

  color:white;

  font-size:38px;
  font-weight:1000;

  white-space:nowrap;

  text-shadow:
    0 0 15px black;

  opacity:0;

  pointer-events:none;
}


/* =========================
 OVERLAY
========================= */

.overlay{
  position:absolute;

  z-index:200;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:25px;

  background:
    linear-gradient(
      rgba(0,0,0,.82),
      rgba(0,0,0,.95)
    );

  color:white;

  text-align:center;
}

.panel{
  width:min(430px,92vw);
}

.logo{
  font-size:42px;

  line-height:.9;

  font-weight:1000;

  letter-spacing:-2px;
}

.description{
  margin:22px 0;

  color:#ddd;

  line-height:1.7;
}

.mainButton{
  width:100%;

  min-height:62px;

  border:0;
  border-radius:16px;

  background:#e00000;

  color:white;

  font-size:19px;
  font-weight:1000;

  box-shadow:
    0 6px 0 #600000;

  touch-action:manipulation;
}

.mainButton:active{
  transform:translateY(4px);

  box-shadow:
    0 2px 0 #600000;
}

.secondaryButton{
  width:100%;

  min-height:55px;

  margin-top:12px;

  border:0;
  border-radius:16px;

  background:#222;

  color:white;

  font-size:17px;
  font-weight:900;
}

.finalScore{
  margin:20px 0;

  font-size:55px;

  font-weight:1000;
}

.rank{
  margin-bottom:20px;

  color:#ffe600;

  font-size:23px;

  font-weight:1000;
}

.small{
  margin-top:18px;

  color:#aaa;

  font-size:13px;

  line-height:1.6;
}

.hidden{
  display:none !important;
}

</style>
</head>


<body>

<div id="game">

  <video
    id="camera"
    autoplay
    muted
    playsinline>
  </video>

  <div id="field"></div>


  <div id="hud">

    <div>

      <div class="scoreTitle">
        SCORE
      </div>

      <div id="score">
        0
      </div>

      <div id="combo">
        COMBO ×1
      </div>

    </div>


    <div>

      <div id="time">
        60
      </div>

      <div id="lives">
        ❤️❤️❤️
      </div>

    </div>

  </div>


  <div id="crosshair">

    <div class="crossRing"></div>

    <div class="crossH"></div>

    <div class="crossV"></div>

    <div class="crossDot"></div>

  </div>


  <div id="banner"></div>


  <button id="attack">
    🔫 ATTACK
  </button>


  <!-- START -->

  <div
    id="startScreen"
    class="overlay">

    <div class="panel">

      <div class="logo">
        CAMERA<br>
        HUNTER
      </div>

      <div class="description">

        📱 スマホを動かして敵を探す<br>
        🎯 中央に合わせる<br>
        🔫 ATTACKで撃つ<br><br>

        敵は空間上の方向に固定されます。

      </div>

      <button
        id="startButton"
        class="mainButton">

        📷 START

      </button>

      <div class="small">

        カメラとモーションセンサーを使用します。<br>
        HTTPS環境で実行してください。

      </div>

    </div>

  </div>


  <!-- ERROR -->

  <div
    id="errorScreen"
    class="overlay hidden">

    <div class="panel">

      <div class="logo">
        ERROR
      </div>

      <div
        id="errorText"
        class="description">
      </div>

      <button
        id="errorRetry"
        class="mainButton">

        🔄 RETRY

      </button>

    </div>

  </div>


  <!-- GAME OVER -->

  <div
    id="gameOver"
    class="overlay hidden">

    <div class="panel">

      <div class="logo">
        GAME OVER
      </div>

      <div
        id="finalScore"
        class="finalScore">
        0
      </div>

      <div
        id="rank"
        class="rank">
        RANK D
      </div>

      <button
        id="retryButton"
        class="mainButton">

        🔥 AGAIN

      </button>

      <button
        id="stopButton"
        class="secondaryButton">

        カメラを停止

      </button>

    </div>

  </div>

</div>


<script>

"use strict";


/* ==========================================
   DOM
========================================== */

const camera =
  document.getElementById(
    "camera"
  );

const field =
  document.getElementById(
    "field"
  );

const startScreen =
  document.getElementById(
    "startScreen"
  );

const startButton =
  document.getElementById(
    "startButton"
  );

const errorScreen =
  document.getElementById(
    "errorScreen"
  );

const errorText =
  document.getElementById(
    "errorText"
  );

const errorRetry =
  document.getElementById(
    "errorRetry"
  );

const gameOver =
  document.getElementById(
    "gameOver"
  );

const retryButton =
  document.getElementById(
    "retryButton"
  );

const stopButton =
  document.getElementById(
    "stopButton"
  );

const attack =
  document.getElementById(
    "attack"
  );

const crosshair =
  document.getElementById(
    "crosshair"
  );

const scoreElement =
  document.getElementById(
    "score"
  );

const comboElement =
  document.getElementById(
    "combo"
  );

const timeElement =
  document.getElementById(
    "time"
  );

const livesElement =
  document.getElementById(
    "lives"
  );

const finalScoreElement =
  document.getElementById(
    "finalScore"
  );

const rankElement =
  document.getElementById(
    "rank"
  );

const banner =
  document.getElementById(
    "banner"
  );


/* ==========================================
   GAME STATE
========================================== */

let stream = null;

let playing = false;

let score = 0;

let combo = 0;

let lives = 3;

let timeLeft = 60;

let gameSeconds = 0;

let nextEnemyId = 1;

let enemies = new Map();

let gameTimer = null;

let spawnTimer = null;

let animationFrame = null;

let lastShotTime = 0;


/* ==========================================
   SENSOR STATE
========================================== */

/*
 * 現在の端末方向
 */

let currentHeading = null;

let currentPitch = null;


/*
 * ゲーム開始時の方向
 *
 * これを「世界の基準」にする。
 */

let referenceHeading = null;

let referencePitch = null;

let sensorReady = false;


/* ==========================================
   ANGLE
========================================== */

function normalizeAngle(angle){

  while(angle > 180){
    angle -= 360;
  }

  while(angle < -180){
    angle += 360;
  }

  return angle;

}


/* ==========================================
   DEVICE ORIENTATION
========================================== */

function orientationHandler(event){

  /*
   * iPhone Safariでは
   * webkitCompassHeading が
   * 使える場合がある。
   *
   * こちらを優先する。
   */

  let heading;


  if(
    typeof event.webkitCompassHeading ===
    "number" &&
    event.webkitCompassHeading !== 0
  ){

    heading =
      event.webkitCompassHeading;

  }else{

    heading =
      event.alpha;

  }


  if(
    heading == null ||
    event.beta == null
  ){

    return;

  }


  currentHeading =
    heading;

  currentPitch =
    event.beta;


  sensorReady = true;

}


let orientationListening = false;


function startOrientation(){

  if(
    orientationListening
  ){

    return true;

  }


  window.addEventListener(
    "deviceorientation",
    orientationHandler,
    true
  );


  orientationListening = true;


  return true;

}


/* ==========================================
   REQUEST SENSOR PERMISSION
========================================== */

async function requestSensorPermission(){

  if(
    typeof DeviceOrientationEvent ===
    "undefined"
  ){

    return false;

  }


  if(
    typeof DeviceOrientationEvent
      .requestPermission ===
    "function"
  ){

    try{

      const result =
        await DeviceOrientationEvent
          .requestPermission();


      if(
        result !== "granted"
      ){

        return false;

      }

    }catch(error){

      return false;

    }

  }


  startOrientation();

  return true;

}


/* ==========================================
   CAMERA
========================================== */

async function startCamera(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    return false;

  }


  try{

    stopCamera();


    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:"environment"
            },

            width:{
              ideal:1920
            },

            height:{
              ideal:1080
            }
          },

          audio:false

        });


    camera.srcObject =
      stream;


    await camera.play();


    return true;

  }catch(error){

    return false;

  }

}


function stopCamera(){

  if(!stream){

    return;

  }


  stream
    .getTracks()
    .forEach(
      track =>
        track.stop()
    );


  stream = null;

  camera.srcObject = null;

}


/* ==========================================
   SHOW ERROR
========================================== */

function showError(message){

  errorText.innerHTML =
    message;

  errorScreen.classList.remove(
    "hidden"
  );

}


/* ==========================================
   START GAME
========================================== */

async function startGame(){

  startButton.disabled =
    true;


  errorScreen.classList.add(
    "hidden"
  );


  /*
   * iPhoneではここが重要。
   *
   * STARTボタンを押した瞬間に
   * センサー許可を要求する。
   */

  const sensorPromise =
    requestSensorPermission();


  const cameraPromise =
    startCamera();


  const [
    sensorOK,
    cameraOK
  ] =
    await Promise.all([
      sensorPromise,
      cameraPromise
    ]);


  startButton.disabled =
    false;


  if(!cameraOK){

    showError(
      "カメラを起動できませんでした。<br><br>" +
      "Safariのカメラ許可を確認してください。"
    );

    return;

  }


  if(!sensorOK){

    showError(
      "モーションセンサーが許可されませんでした。<br><br>" +
      "iPhoneのセンサー許可を確認してください。"
    );

    return;

  }


  /*
   * センサー値が来るまで少し待つ
   */

  const waitStart =
    performance.now();


  while(
    !sensorReady &&
    performance.now() -
    waitStart < 2000
  ){

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          50
        )
    );

  }


  if(!sensorReady){

    showError(
      "端末の向きを取得できませんでした。"
    );

    return;

  }


  /*
   * ====================================
   * ★ 世界の基準方向
   * ====================================
   */

  referenceHeading =
    currentHeading;

  referencePitch =
    currentPitch;


  startScreen.classList.add(
    "hidden"
  );


  gameOver.classList.add(
    "hidden"
  );


  beginRound();

}


/* ==========================================
   CURRENT VIEW
========================================== */

function getViewYaw(){

  if(
    currentHeading == null ||
    referenceHeading == null
  ){

    return 0;

  }


  return normalizeAngle(
    currentHeading -
    referenceHeading
  );

}


function getViewPitch(){

  if(
    currentPitch == null ||
    referencePitch == null
  ){

    return 0;

  }


  return (
    currentPitch -
    referencePitch
  );

}


/* ==========================================
   BEGIN ROUND
========================================== */

function beginRound(){

  stopRound();


  score = 0;

  combo = 0;

  lives = 3;

  timeLeft = 60;

  gameSeconds = 0;

  playing = true;


  updateHUD();


  /*
   * 最初の敵。
   *
   * 現在向いている方向から
   * 右または左に配置。
   */

  spawnEnemy();

  spawnEnemy();

  spawnEnemy();


  /*
   * 追加スポーン
   */

  spawnTimer =
    setInterval(
      () => {

        if(!playing){
          return;
        }


        let count = 1;


        if(
          gameSeconds >= 20
        ){

          count = 2;

        }


        if(
          gameSeconds >= 40
        ){

          count = 3;

        }


        for(
          let i = 0;
          i < count;
          i++
        ){

          setTimeout(
            spawnEnemy,
            i * 250
          );

        }

      },
      1600
    );


  /*
   * 時計
   */

  gameTimer =
    setInterval(
      () => {

        if(!playing){
          return;
        }


        timeLeft--;

        gameSeconds++;


        if(
          timeLeft === 45
        ){

          showBanner(
            "WAVE 2"
          );

        }


        if(
          timeLeft === 30
        ){

          showBanner(
            "👑 BOSS"
          );

          spawnBoss();

        }


        if(
          timeLeft === 15
        ){

          showBanner(
            "FINAL WAVE"
          );

        }


        updateHUD();


        if(
          timeLeft <= 0
        ){

          finishGame();

        }

      },
      1000
    );


  animationFrame =
    requestAnimationFrame(
      gameLoop
    );

}


/* ==========================================
   SPAWN NORMAL ENEMY
========================================== */

function spawnEnemy(){

  if(!playing){
    return;
  }


  if(
    enemies.size >= 15
  ){

    return;

  }


  /*
   * 現在の視線
   *
   * ★ここで一度だけ使う
   */

  const viewYaw =
    getViewYaw();

  const viewPitch =
    getViewPitch();


  /*
   * 敵を左右どちらかに置く
   */

  const direction =
    Math.random() < .5
      ? -1
      : 1;


  const distance =
    25 +
    Math.random() * 35;


  /*
   * ★★★★★★★★★★★★★
   *
   * ここで世界座標を確定。
   *
   * 以後、この値は
   * 一切変更しない。
   *
   * ★★★★★★★★★★★★★
   */

  const worldYaw =
    viewYaw +
    direction *
    distance;


  const worldPitch =
    viewPitch +
    (
      Math.random() * 36 -
      18
    );


  const element =
    document.createElement(
      "div"
    );


  element.className =
    "enemy";


  const body =
    document.createElement(
      "div"
    );


  body.className =
    "enemyBody";


  element.appendChild(
    body
  );


  field.appendChild(
    element
  );


  const enemy = {

    id:
      nextEnemyId++,

    element,

    /*
     * 世界座標
     *
     * ★絶対に変更しない★
     */

    worldYaw,

    worldPitch,

    hp:1,

    maxHp:1,

    boss:false,

    born:
      performance.now(),

    lifetime:
      7000 +
      Math.random() * 2500

  };


  enemies.set(
    enemy.id,
    enemy
  );

}


/* ==========================================
   BOSS
========================================== */

function spawnBoss(){

  if(!playing){
    return;
  }


  const viewYaw =
    getViewYaw();

  const viewPitch =
    getViewPitch();


  const direction =
    Math.random() < .5
      ? -1
      : 1;


  const element =
    document.createElement(
      "div"
    );


  element.className =
    "enemy boss";


  const body =
    document.createElement(
      "div"
    );


  body.className =
    "enemyBody";


  element.appendChild(
    body
  );


  const hp =
    document.createElement(
      "div"
    );


  hp.className =
    "hp";


  const hpBar =
    document.createElement(
      "div"
    );


  hpBar.className =
    "hpBar";


  hp.appendChild(
    hpBar
  );


  element.appendChild(
    hp
  );


  field.appendChild(
    element
  );


  const enemy = {

    id:
      nextEnemyId++,

    element,

    /*
     * ボスの世界座標も固定
     */

    worldYaw:
      viewYaw +
      direction *
      (
        35 +
        Math.random() * 20
      ),

    worldPitch:
      viewPitch +
      (
        Math.random() * 24 -
        12
      ),

    hp:5,

    maxHp:5,

    hpBar,

    boss:true,

    born:
      performance.now(),

    lifetime:13000

  };


  enemies.set(
    enemy.id,
    enemy
  );

}


/* ==========================================
   WORLD → SCREEN
========================================== */

function projectEnemy(enemy){

  const width =
    window.innerWidth;

  const height =
    window.innerHeight;


  /*
   * 現在のカメラ方向
   */

  const cameraYaw =
    getViewYaw();

  const cameraPitch =
    getViewPitch();


  /*
   * ====================================
   * 世界に固定された敵と
   * 現在のカメラ方向の差
   * ====================================
   */

  const yawDiff =
    normalizeAngle(
      enemy.worldYaw -
      cameraYaw
    );


  const pitchDiff =
    enemy.worldPitch -
    cameraPitch;


  /*
   * カメラの視野角
   */

  const horizontalFOV =
    70;

  const verticalFOV =
    55;


  /*
   * ★ここが左右の重要部分
   *
   * 世界 - カメラ
   *
   * 右を向けば敵は左へ。
   */

  const x =
    width / 2 +
    (
      yawDiff /
      horizontalFOV
    ) *
    width;


  const y =
    height / 2 +
    (
      pitchDiff /
      verticalFOV
    ) *
    height;


  /*
   * 時間経過によって
   * 敵が近づくように大きくする。
   *
   * ただし、
   * worldYaw/worldPitchは
   * 絶対に変えない。
   */

  const age =
    performance.now() -
    enemy.born;


  const progress =
    Math.min(
      1,
      age /
      enemy.lifetime
    );


  const scale =
    enemy.boss
      ? .55 +
        progress * .9
      : .45 +
        progress * 1.1;


  enemy.element.style.left =
    x + "px";


  enemy.element.style.top =
    y + "px";


  enemy.element.style.transform =
    "translate(-50%,-50%) " +
    "scale(" +
    scale +
    ")";


  /*
   * 画面外
   */

  if(
    x < -200 ||
    x > width + 200 ||
    y < -200 ||
    y > height + 200
  ){

    enemy.element.style.opacity =
      ".2";

  }else{

    enemy.element.style.opacity =
      "1";

  }


  return {
    x,
    y,
    scale,
    yawDiff,
    pitchDiff
  };

}


/* ==========================================
   TARGET
========================================== */

function getTarget(){

  const centerX =
    window.innerWidth / 2;

  const centerY =
    window.innerHeight / 2;


  let best = null;

  let bestDistance =
    Infinity;


  enemies.forEach(
    enemy => {

      const p =
        projectEnemy(
          enemy
        );


      const dx =
        p.x -
        centerX;


      const dy =
        p.y -
        centerY;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      /*
       * 照準内
       */

      const radius =
        enemy.boss
          ? 105
          : 58;


      if(
        distance <= radius &&
        distance < bestDistance
      ){

        bestDistance =
          distance;

        best =
          enemy;

      }

    }
  );


  return best;

}


/* ==========================================
   AIM UPDATE
========================================== */

function updateAim(){

  if(!playing){

    crosshair.classList.remove(
      "lock"
    );

    return;

  }


  const target =
    getTarget();


  if(target){

    crosshair.classList.add(
      "lock"
    );

  }else{

    crosshair.classList.remove(
      "lock"
    );

  }

}


/* ==========================================
   FIRE
========================================== */

function fire(){

  if(!playing){
    return;
  }


  const now =
    performance.now();


  if(
    now -
    lastShotTime <
    180
  ){

    return;

  }


  lastShotTime =
    now;


  const target =
    getTarget();


  if(!target){

    combo = 0;


    showHit(
      window.innerWidth / 2,
      window.innerHeight / 2,
      "MISS"
    );


    if(
      navigator.vibrate
    ){

      navigator.vibrate(15);

    }


    updateHUD();

    return;

  }


  /*
   * 命中
   */

  target.hp--;

  combo++;


  const multiplier =
    Math.min(
      10,
      Math.max(
        1,
        combo
      )
    );


  /*
   * ボスがまだ生きている
   */

  if(
    target.hp > 0
  ){

    const points =
      100 *
      multiplier;


    score += points;


    const p =
      projectEnemy(
        target
      );


    showHit(
      p.x,
      p.y,
      "HIT!"
    );


    if(target.hpBar){

      target.hpBar.style.width =
        (
          target.hp /
          target.maxHp *
          100
        ) + "%";

    }


    if(
      navigator.vibrate
    ){

      navigator.vibrate(25);

    }


    updateHUD();

    return;

  }


  /*
   * 撃破
   */

  const points =
    target.boss
      ? 3000 * multiplier
      : 150 * multiplier;


  score += points;


  const p =
    projectEnemy(
      target
    );


  showHit(
    p.x,
    p.y,
    "+" + points
  );


  explode(
    p.x,
    p.y,
    target.boss
      ? 160
      : 80
  );


  target.element.remove();


  enemies.delete(
    target.id
  );


  if(target.boss){

    showBanner(
      "💥 BOSS DOWN!"
    );

  }


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      target.boss
        ? [50,30,100]
        : 30
    );

  }


  updateHUD();

}


/* ==========================================
   GAME LOOP
========================================== */

function gameLoop(){

  if(!playing){
    return;
  }


  const now =
    performance.now();


  /*
   * 敵を更新
   */

  enemies.forEach(
    enemy => {

      const age =
        now -
        enemy.born;


      /*
       * 時間切れ
       */

      if(
        age >
        enemy.lifetime
      ){

        enemy.element.remove();


        enemies.delete(
          enemy.id
        );


        lives--;

        combo = 0;


        updateHUD();


        if(
          lives <= 0
        ){

          finishGame();

        }


        return;

      }


      /*
       * ★★★★★★★★★★★★★★★
       *
       * ここで敵の世界座標を
       * 絶対に変更しない。
       *
       * enemy.worldYaw
       * enemy.worldPitch
       *
       * は固定。
       *
       * ★★★★★★★★★★★★★★★
       */

      projectEnemy(
        enemy
      );

    }
  );


  updateAim();


  animationFrame =
    requestAnimationFrame(
      gameLoop
    );

}


/* ==========================================
   HUD
========================================== */

function updateHUD(){

  scoreElement.textContent =
    score.toLocaleString();


  comboElement.textContent =
    "COMBO ×" +
    Math.max(
      1,
      combo
    );


  timeElement.textContent =
    timeLeft;


  livesElement.textContent =
    "❤️".repeat(lives) +
    "🖤".repeat(
      3 - lives
    );

}


/* ==========================================
   EFFECTS
========================================== */

function showHit(
  x,
  y,
  text
){

  const element =
    document.createElement(
      "div"
    );


  element.className =
    "hitText";


  element.textContent =
    text;


  element.style.left =
    x + "px";


  element.style.top =
    y + "px";


  field.appendChild(
    element
  );


  setTimeout(
    () =>
      element.remove(),
    600
  );

}


function explode(
  x,
  y,
  size
){

  const element =
    document.createElement(
      "div"
    );


  element.className =
    "explosion";


  element.style.left =
    x + "px";


  element.style.top =
    y + "px";


  element.style.width =
    size + "px";


  element.style.height =
    size + "px";


  field.appendChild(
    element
  );


  setTimeout(
    () =>
      element.remove(),
    500
  );

}


/* ==========================================
   BANNER
========================================== */

let bannerTimeout = null;


function showBanner(text){

  banner.textContent =
    text;

  banner.style.opacity =
    "1";


  clearTimeout(
    bannerTimeout
  );


  bannerTimeout =
    setTimeout(
      () => {

        banner.style.opacity =
          "0";

      },
      1100
    );

}


/* ==========================================
   END
========================================== */

function finishGame(){

  if(!playing){
    return;
  }


  playing = false;


  stopRound();


  finalScoreElement.textContent =
    score.toLocaleString();


  rankElement.textContent =
    getRank(score);


  gameOver.classList.remove(
    "hidden"
  );

}


function stopRound(){

  clearInterval(
    gameTimer
  );

  clearInterval(
    spawnTimer
  );


  if(animationFrame){

    cancelAnimationFrame(
      animationFrame
    );

  }


  gameTimer = null;

  spawnTimer = null;

  animationFrame = null;


  enemies.forEach(
    enemy =>
      enemy.element.remove()
  );


  enemies.clear();

}


/* ==========================================
   RANK
========================================== */

function getRank(score){

  if(score >= 20000)
    return "RANK S";

  if(score >= 12000)
    return "RANK A";

  if(score >= 7000)
    return "RANK B";

  if(score >= 3000)
    return "RANK C";

  return "RANK D";

}


/* ==========================================
   BUTTONS
========================================== */

startButton.addEventListener(
  "click",
  startGame
);


errorRetry.addEventListener(
  "click",
  startGame
);


attack.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    event.stopPropagation();

    fire();

  },
  {
    passive:false
  }
);


retryButton.addEventListener(
  "click",
  () => {

    gameOver.classList.add(
      "hidden"
    );


    /*
     * リトライ時は
     * 今向いている方向を
     * 新しい世界の正面にする。
     */

    referenceHeading =
      currentHeading;

    referencePitch =
      currentPitch;


    beginRound();

  }
);


stopButton.addEventListener(
  "click",
  () => {

    playing = false;

    stopRound();

    stopCamera();


    gameOver.classList.add(
      "hidden"
    );


    startScreen.classList.remove(
      "hidden"
    );

  }
);


/* ==========================================
   PREVENT ZOOM / LONG PRESS
========================================== */

document.addEventListener(
  "dblclick",
  e => {
    e.preventDefault();
  },
  {
    passive:false
  }
);


document.addEventListener(
  "gesturestart",
  e => {
    e.preventDefault();
  },
  {
    passive:false
  }
);


document.addEventListener(
  "gesturechange",
  e => {
    e.preventDefault();
  },
  {
    passive:false
  }
);


document.addEventListener(
  "gestureend",
  e => {
    e.preventDefault();
  },
  {
    passive:false
  }
);


/* ==========================================
   INITIAL
========================================== */

updateHUD();

</script>
