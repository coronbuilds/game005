<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>CAMERA HUNTER 3</title>

<style>

*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#000;
}

#camera{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  pointer-events:none;
}

/* --------------------
   GAME FIELD
-------------------- */

#field{
  position:absolute;
  inset:0;
  overflow:hidden;
  touch-action:none;
}

/* --------------------
   HUD
-------------------- */

#hud{
  position:absolute;
  z-index:100;

  top:0;
  left:0;
  right:0;

  padding:
    calc(env(safe-area-inset-top) + 10px)
    14px
    10px;

  display:flex;
  justify-content:space-between;

  color:#fff;

  text-shadow:
    0 2px 5px #000;

  pointer-events:none;
}

.scoreTitle{
  font-size:11px;
  font-weight:bold;
  opacity:.8;
}

#score{
  font-size:27px;
  font-weight:1000;
}

#combo{
  font-size:16px;
  color:#ffe600;
  font-weight:1000;
}

#time{
  font-size:27px;
  font-weight:1000;
  text-align:right;
}

#lives{
  font-size:17px;
  text-align:right;
}

/* --------------------
   ENEMY
-------------------- */

.enemy{
  position:absolute;

  width:80px;
  height:80px;

  transform:
    translate(-50%,-50%);

  z-index:20;

  touch-action:none;
}

.enemyBody{
  width:100%;
  height:100%;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 32%,
      #fff 0 5%,
      transparent 6%
    ),
    radial-gradient(
      circle at 65% 32%,
      #fff 0 5%,
      transparent 6%
    ),
    radial-gradient(
      circle at 35% 32%,
      #ff4444 0 14%,
      transparent 15%
    ),
    radial-gradient(
      circle at 65% 32%,
      #ff4444 0 14%,
      transparent 15%
    ),
    radial-gradient(
      circle at 50% 65%,
      #111 0 20%,
      transparent 21%
    ),
    linear-gradient(
      145deg,
      #ff3838,
      #680000
    );

  border:3px solid white;

  box-shadow:
    0 0 12px #ff0000,
    0 0 30px #ff0000;
}

.enemy:after{
  content:"";

  position:absolute;

  inset:-10px;

  border:2px solid
    rgba(255,255,255,.5);

  border-radius:50%;
}

/* ボス */

.enemy.boss{
  width:120px;
  height:120px;
}

.enemy.boss .enemyBody{
  border-width:5px;

  box-shadow:
    0 0 20px #ff0000,
    0 0 60px #ff0000;
}

/* --------------------
   HP
-------------------- */

.hp{
  position:absolute;

  left:50%;
  top:-15px;

  width:100%;
  height:8px;

  transform:
    translateX(-50%);

  background:#111;

  border:1px solid #fff;

  border-radius:10px;

  overflow:hidden;
}

.hp i{
  display:block;

  width:100%;
  height:100%;

  background:#39ff54;
}

/* --------------------
   CROSSHAIR
-------------------- */

#crosshair{
  position:absolute;

  z-index:90;

  width:58px;
  height:58px;

  transform:
    translate(-50%,-50%);

  pointer-events:none;
}

#crosshair:before,
#crosshair:after{
  content:"";

  position:absolute;

  background:#fff;

  box-shadow:
    0 0 5px #000;
}

#crosshair:before{
  width:58px;
  height:2px;

  top:28px;
  left:0;
}

#crosshair:after{
  width:2px;
  height:58px;

  left:28px;
  top:0;
}

.crossCircle{
  position:absolute;

  inset:12px;

  border:2px solid #fff;

  border-radius:50%;
}

/* --------------------
   SHOT
-------------------- */

.shot{
  position:absolute;

  z-index:80;

  width:8px;
  height:8px;

  background:#fff;

  border-radius:50%;

  box-shadow:
    0 0 15px 6px #ffe600;

  transform:
    translate(-50%,-50%);

  pointer-events:none;
}

/* --------------------
   HIT TEXT
-------------------- */

.hit{
  position:absolute;

  z-index:110;

  transform:
    translate(-50%,-50%);

  color:#fff;

  font-size:24px;

  font-weight:1000;

  text-shadow:
    0 0 10px #f00,
    0 3px 5px #000;

  pointer-events:none;

  animation:
    hitAnim .6s forwards;
}

@keyframes hitAnim{

  from{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(.7);
  }

  to{
    opacity:0;

    transform:
      translate(-50%,-120px)
      scale(1.5);
  }

}

/* --------------------
   EXPLOSION
-------------------- */

.explosion{
  position:absolute;

  z-index:105;

  border:4px solid #fff;

  border-radius:50%;

  transform:
    translate(-50%,-50%);

  pointer-events:none;

  animation:
    boom .45s forwards;
}

@keyframes boom{

  from{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale:.2;
  }

  to{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale:4;
  }

}

/* --------------------
   WAVE
-------------------- */

#banner{
  position:absolute;

  z-index:120;

  top:25%;
  left:50%;

  transform:
    translate(-50%,-50%);

  color:#fff;

  font-size:36px;

  font-weight:1000;

  white-space:nowrap;

  text-shadow:
    0 0 15px #000;

  opacity:0;

  pointer-events:none;
}

/* --------------------
   MENU
-------------------- */

.overlay{
  position:absolute;

  inset:0;

  z-index:200;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:24px;

  background:
    linear-gradient(
      rgba(0,0,0,.72),
      rgba(0,0,0,.93)
    );

  color:#fff;

  text-align:center;
}

.panel{
  width:min(430px,92vw);
}

.logo{
  font-size:42px;

  line-height:.88;

  font-weight:1000;

  letter-spacing:-2px;
}

.sub{
  margin:
    18px 0 25px;

  color:#ddd;

  line-height:1.6;
}

button{
  width:100%;

  min-height:58px;

  border:0;

  border-radius:16px;

  background:#e00000;

  color:white;

  font-size:19px;

  font-weight:1000;

  box-shadow:
    0 6px 0 #760000;

  touch-action:manipulation;
}

button:active{
  transform:
    translateY(4px);

  box-shadow:
    0 2px 0 #760000;
}

button.secondary{
  margin-top:12px;

  background:#222;

  box-shadow:
    0 6px 0 #111;
}

.small{
  margin-top:18px;

  color:#aaa;

  font-size:13px;

  line-height:1.6;
}

.finalScore{
  font-size:54px;

  font-weight:1000;

  margin:
    15px 0;
}

.rank{
  color:#ffe600;

  font-size:20px;

  font-weight:1000;

  margin-bottom:20px;
}

</style>
</head>

<body>

<div id="game">

<video
  id="camera"
  autoplay
  muted
  playsinline>
</video>

<div id="field"></div>

<div id="hud">

  <div>

    <div class="scoreTitle">
      SCORE
    </div>

    <div id="score">
      0
    </div>

    <div id="combo">
      COMBO ×1
    </div>

  </div>

  <div>

    <div id="time">
      60
    </div>

    <div id="lives">
      ❤️❤️❤️
    </div>

  </div>

</div>

<div
  id="crosshair"
  style="left:50%;top:50%">

  <div class="crossCircle"></div>

</div>

<div id="banner"></div>


<!-- START -->

<div
  id="start"
  class="overlay">

  <div class="panel">

    <div class="logo">
      CAMERA<br>
      HUNTER 3
    </div>

    <div class="sub">
      現実の景色に潜む敵を撃て。<br>
      敵は遠くから、あなたに向かって迫ってくる。
    </div>

    <button id="startButton">
      📷 カメラを起動
    </button>

    <div class="small">
      リアカメラを使用します。<br>
      カメラの許可が出たら「許可」を押してください。
    </div>

  </div>

</div>


<!-- ERROR -->

<div
  id="error"
  class="overlay"
  style="display:none">

  <div class="panel">

    <div class="logo">
      CAMERA<br>
      ERROR
    </div>

    <div class="sub">
      カメラを起動できませんでした。
      <br><br>
      Safariのカメラ許可を確認してください。
    </div>

    <button id="retryCamera">
      もう一度
    </button>

  </div>

</div>


<!-- GAME OVER -->

<div
  id="gameOver"
  class="overlay"
  style="display:none">

  <div class="panel">

    <div class="logo">
      GAME OVER
    </div>

    <div
      id="finalScore"
      class="finalScore">
      0
    </div>

    <div
      id="rank"
      class="rank">
      RANK D
    </div>

    <button id="retry">
      🔥 もう一度
    </button>

    <button
      id="stop"
      class="secondary">
      カメラを停止
    </button>

  </div>

</div>

</div>


<script>

"use strict";


/* =========================
   DOM
========================= */

const camera =
  document.getElementById(
    "camera"
  );

const field =
  document.getElementById(
    "field"
  );

const start =
  document.getElementById(
    "start"
  );

const errorScreen =
  document.getElementById(
    "error"
  );

const gameOver =
  document.getElementById(
    "gameOver"
  );

const startButton =
  document.getElementById(
    "startButton"
  );

const retryCamera =
  document.getElementById(
    "retryCamera"
  );

const retry =
  document.getElementById(
    "retry"
  );

const stop =
  document.getElementById(
    "stop"
  );

const scoreEl =
  document.getElementById(
    "score"
  );

const comboEl =
  document.getElementById(
    "combo"
  );

const timeEl =
  document.getElementById(
    "time"
  );

const livesEl =
  document.getElementById(
    "lives"
  );

const finalScoreEl =
  document.getElementById(
    "finalScore"
  );

const rankEl =
  document.getElementById(
    "rank"
  );

const crosshair =
  document.getElementById(
    "crosshair"
  );

const banner =
  document.getElementById(
    "banner"
  );


/* =========================
   STATE
========================= */

let stream = null;

let playing = false;

let score = 0;

let combo = 0;

let lives = 3;

let time = 60;

let elapsed = 0;

let nextEnemyId = 0;

let enemies =
  new Map();

let lastFrame = 0;

let animation = null;

let timer = null;

let spawner = null;


/* =========================
   HUD
========================= */

function updateHUD(){

  scoreEl.textContent =
    score.toLocaleString();

  comboEl.textContent =
    "COMBO ×" +
    Math.max(
      1,
      combo
    );

  timeEl.textContent =
    time;

  livesEl.textContent =
    "❤️".repeat(lives) +
    "🖤".repeat(
      3 - lives
    );

}


/* =========================
   CAMERA
========================= */

async function openCamera(){

  errorScreen.style.display =
    "none";

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Camera unavailable"
      );

    }

    stopCamera();


    stream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          }
        },

        audio:false

      });


    camera.srcObject =
      stream;


    await camera.play();


    return true;

  }
  catch(e){

    errorScreen.style.display =
      "flex";

    return false;

  }

}


function stopCamera(){

  if(!stream)
    return;


  stream
    .getTracks()
    .forEach(
      track =>
        track.stop()
    );


  stream = null;

  camera.srcObject = null;

}


/* =========================
   GAME START
========================= */

function startGame(){

  stopEverything();


  score = 0;

  combo = 0;

  lives = 3;

  time = 60;

  elapsed = 0;

  playing = true;


  start.style.display =
    "none";

  errorScreen.style.display =
    "none";

  gameOver.style.display =
    "none";


  updateHUD();


  spawnEnemy();

  spawnEnemy();


  /*
   * 敵を定期的に生成
   */

  spawner =
    setInterval(
      function(){

        if(!playing)
          return;


        const amount =
          Math.min(
            3,
            1 +
            Math.floor(
              elapsed / 15
            )
          );


        for(
          let i = 0;
          i < amount;
          i++
        ){

          setTimeout(
            () =>
              spawnEnemy(),
            i * 220
          );

        }

      },
      1100
    );


  /*
   * 時間
   */

  timer =
    setInterval(
      function(){

        if(!playing)
          return;


        time--;

        elapsed++;


        if(time === 45){

          showBanner(
            "WAVE 2"
          );

        }


        if(time === 30){

          showBanner(
            "⚠️ BOSS INCOMING"
          );

          spawnBoss();

        }


        if(time === 15){

          showBanner(
            "FINAL WAVE"
          );

        }


        updateHUD();


        if(time <= 0){

          endGame();

        }

      },
      1000
    );


  lastFrame =
    performance.now();


  animation =
    requestAnimationFrame(
      loop
    );

}


/* =========================
   SPAWN ENEMY
========================= */

function spawnEnemy(){

  if(!playing)
    return;


  if(enemies.size >= 9)
    return;


  const w =
    window.innerWidth;

  const h =
    window.innerHeight;


  /*
   * 最初は画面の端。
   * 奥にいる敵なので小さい。
   */

  const side =
    Math.floor(
      Math.random() * 4
    );


  let x;
  let y;


  if(side === 0){

    x =
      Math.random() * w;

    y =
      90;

  }
  else if(side === 1){

    x =
      w - 30;

    y =
      120 +
      Math.random() *
      (h - 220);

  }
  else if(side === 2){

    x =
      Math.random() * w;

    y =
      h - 50;

  }
  else{

    x =
      30;

    y =
      120 +
      Math.random() *
      (h - 220);

  }


  const enemy =
    document.createElement(
      "div"
    );


  enemy.className =
    "enemy";


  const body =
    document.createElement(
      "div"
    );


  body.className =
    "enemyBody";


  enemy.appendChild(
    body
  );


  const id =
    ++nextEnemyId;


  field.appendChild(
    enemy
  );


  const data = {

    id,

    element:enemy,

    x,

    y,

    /*
     * 0.15 = かなり遠い
     * 1.0  = 手前
     */

    z:.15,

    speed:
      .10 +
      Math.random() *
      .08 +
      elapsed *
      .0015,

    hp:1,

    boss:false

  };


  enemies.set(
    id,
    data
  );


  /*
   * 敵をタップ
   */

  enemy.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      e.stopPropagation();

      shoot(
        id,
        e.clientX,
        e.clientY
      );

    },
    {
      passive:false
    }
  );

}


/* =========================
   BOSS
========================= */

function spawnBoss(){

  if(!playing)
    return;


  const w =
    window.innerWidth;

  const h =
    window.innerHeight;


  const enemy =
    document.createElement(
      "div"
    );


  enemy.className =
    "enemy boss";


  const body =
    document.createElement(
      "div"
    );


  body.className =
    "enemyBody";


  enemy.appendChild(
    body
  );


  const hp =
    document.createElement(
      "div"
    );


  hp.className =
    "hp";


  const hpFill =
    document.createElement(
      "i"
    );


  hp.appendChild(
    hpFill
  );


  enemy.appendChild(
    hp
  );


  const id =
    ++nextEnemyId;


  field.appendChild(
    enemy
  );


  const data = {

    id,

    element:enemy,

    x:w / 2,

    y:120,

    z:.12,

    speed:.055,

    hp:5,

    boss:true,

    hpFill

  };


  enemies.set(
    id,
    data
  );


  enemy.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      e.stopPropagation();

      shoot(
        id,
        e.clientX,
        e.clientY
      );

    },
    {
      passive:false
    }
  );


  showBanner(
    "👑 BOSS"
  );

}


/* =========================
   MAIN LOOP
========================= */

function loop(now){

  if(!playing)
    return;


  const delta =
    Math.min(
      .05,
      (
        now -
        lastFrame
      ) / 1000 || 0
    );


  lastFrame =
    now;


  enemies.forEach(
    enemy => {

      /*
       * 奥 → 手前
       */

      enemy.z +=
        enemy.speed *
        delta;


      /*
       * カメラ中心方向へ
       */

      const centerX =
        window.innerWidth / 2;

      const centerY =
        window.innerHeight / 2;


      const dx =
        centerX -
        enemy.x;

      const dy =
        centerY -
        enemy.y;


      enemy.x +=
        dx *
        delta *
        .08;


      enemy.y +=
        dy *
        delta *
        .08;


      /*
       * 奥行きによって巨大化
       */

      const baseSize =
        enemy.boss
          ? 120
          : 72;


      const size =
        baseSize *
        (
          .35 +
          enemy.z *
          1.8
        );


      enemy.element.style.width =
        size + "px";


      enemy.element.style.height =
        size + "px";


      enemy.element.style.left =
        enemy.x + "px";


      enemy.element.style.top =
        enemy.y + "px";


      /*
       * 透明度
       */

      enemy.element.style.opacity =
        Math.min(
          1,
          .35 +
          enemy.z
        );


      /*
       * 一定以上近づいたら攻撃
       */

      if(enemy.z >= 1){

        enemyReachedPlayer(
          enemy.id
        );

      }

    }
  );


  animation =
    requestAnimationFrame(
      loop
    );

}


/* =========================
   ENEMY REACHED
========================= */

function enemyReachedPlayer(
  id
){

  const enemy =
    enemies.get(id);


  if(!enemy)
    return;


  enemy.element.remove();

  enemies.delete(id);


  lives--;

  combo = 0;


  showHit(
    enemy.x,
    enemy.y,
    "DANGER!"
  );


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [70,30,70]
    );

  }


  updateHUD();


  if(lives <= 0){

    endGame();

  }

}


/* =========================
   SHOOT
========================= */

function shoot(
  id,
  sx,
  sy
){

  if(!playing)
    return;


  const enemy =
    enemies.get(id);


  if(!enemy)
    return;


  createShot(
    sx,
    sy,
    enemy.x,
    enemy.y
  );


  enemy.hp--;


  if(
    enemy.boss &&
    enemy.hpFill
  ){

    enemy.hpFill.style.width =
      (
        enemy.hp / 5 * 100
      ) + "%";

  }


  if(enemy.hp > 0){

    combo++;

    score +=
      50 *
      Math.max(
        1,
        combo
      );


    showHit(
      enemy.x,
      enemy.y,
      "HIT!"
    );


    updateHUD();

    return;

  }


  /*
   * 撃破
   */

  combo++;


  const multiplier =
    Math.min(
      10,
      Math.max(
        1,
        combo
      )
    );


  const points =
    enemy.boss
      ? 2000 * multiplier
      : Math.round(
          (
            100 +
            enemy.z * 250
          ) *
          multiplier
        );


  score += points;


  showHit(
    enemy.x,
    enemy.y,
    "+" + points
  );


  createExplosion(
    enemy.x,
    enemy.y,
    enemy.boss
      ? 150
      : 70 +
        enemy.z * 70
  );


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      enemy.boss
        ? [40,30,80]
        : 20
    );

  }


  enemy.element.remove();

  enemies.delete(id);


  updateHUD();

}


/* =========================
   MISS
========================= */

field.addEventListener(
  "pointerdown",
  function(e){

    if(!playing)
      return;


    /*
     * 敵を直接タップした場合は
     * 敵側のイベントで処理される。
     *
     * ここでは空振りだけ処理。
     */

    combo = 0;


    showHit(
      e.clientX,
      e.clientY,
      "MISS"
    );


    updateHUD();

  },
  {
    passive:false
  }
);


/* =========================
   SHOT EFFECT
========================= */

function createShot(
  x1,
  y1,
  x2,
  y2
){

  const shot =
    document.createElement(
      "div"
    );


  shot.className =
    "shot";


  shot.style.left =
    x1 + "px";


  shot.style.top =
    y1 + "px";


  field.appendChild(
    shot
  );


  requestAnimationFrame(
    () => {

      shot.style.transition =
        "left .12s linear," +
        "top .12s linear";


      shot.style.left =
        x2 + "px";


      shot.style.top =
        y2 + "px";

    }
  );


  setTimeout(
    () => shot.remove(),
    160
  );

}


/* =========================
   HIT
========================= */

function showHit(
  x,
  y,
  text
){

  const hit =
    document.createElement(
      "div"
    );


  hit.className =
    "hit";


  hit.textContent =
    text;


  hit.style.left =
    x + "px";


  hit.style.top =
    y + "px";


  field.appendChild(
    hit
  );


  setTimeout(
    () => hit.remove(),
    650
  );

}


/* =========================
   EXPLOSION
========================= */

function createExplosion(
  x,
  y,
  size
){

  const boom =
    document.createElement(
      "div"
    );


  boom.className =
    "explosion";


  boom.style.width =
    size + "px";


  boom.style.height =
    size + "px";


  boom.style.left =
    x + "px";


  boom.style.top =
    y + "px";


  field.appendChild(
    boom
  );


  setTimeout(
    () => boom.remove(),
    500
  );

}


/* =========================
   BANNER
========================= */

let bannerTimeout;


function showBanner(
  text
){

  banner.textContent =
    text;


  banner.style.opacity =
    "1";


  clearTimeout(
    bannerTimeout
  );


  bannerTimeout =
    setTimeout(
      () => {

        banner.style.opacity =
          "0";

      },
      1000
    );

}


/* =========================
   END
========================= */

function endGame(){

  if(!playing)
    return;


  playing = false;


  stopEverything();


  finalScoreEl.textContent =
    score.toLocaleString();


  rankEl.textContent =
    getRank(score);


  gameOver.style.display =
    "flex";


  saveBestScore();

}


/* =========================
   STOP
========================= */

function stopEverything(){

  clearInterval(
    timer
  );

  clearInterval(
    spawner
  );


  timer = null;

  spawner = null;


  cancelAnimationFrame(
    animation
  );


  enemies.forEach(
    enemy =>
      enemy.element.remove()
  );


  enemies.clear();

}


/* =========================
   RANK
========================= */

function getRank(
  value
){

  if(value >= 20000)
    return "RANK S";

  if(value >= 13000)
    return "RANK A";

  if(value >= 7000)
    return "RANK B";

  if(value >= 3000)
    return "RANK C";

  return "RANK D";

}


/* =========================
   HIGH SCORE
========================= */

function saveBestScore(){

  const best =
    Number(
      localStorage.getItem(
        "cameraHunterBest"
      ) || 0
    );


  if(score > best){

    localStorage.setItem(
      "cameraHunterBest",
      score
    );

  }

}


/* =========================
   CROSSHAIR
========================= */

document.addEventListener(
  "pointermove",
  function(e){

    if(!playing)
      return;


    crosshair.style.left =
      e.clientX + "px";


    crosshair.style.top =
      e.clientY + "px";

  },
  {
    passive:true
  }
);


/* =========================
   BUTTONS
========================= */

startButton.addEventListener(
  "click",
  async function(){

    startButton.disabled =
      true;


    const ok =
      await openCamera();


    startButton.disabled =
      false;


    if(ok){

      startGame();

    }

  }
);


retryCamera.addEventListener(
  "click",
  async function(){

    const ok =
      await openCamera();


    if(ok){

      startGame();

    }

  }
);


retry.addEventListener(
  "click",
  function(){

    if(stream){

      startGame();

    }

  }
);


stop.addEventListener(
  "click",
  function(){

    playing = false;

    stopEverything();

    stopCamera();


    gameOver.style.display =
      "none";


    start.style.display =
      "flex";

  }
);


/* =========================
   PREVENT ZOOM
========================= */

function preventZoom(e){

  e.preventDefault();

}


document.addEventListener(
  "dblclick",
  preventZoom,
  {
    passive:false
  }
);


document.addEventListener(
  "gesturestart",
  preventZoom,
  {
    passive:false
  }
);


document.addEventListener(
  "gesturechange",
  preventZoom,
  {
    passive:false
  }
);


document.addEventListener(
  "gestureend",
  preventZoom,
  {
    passive:false
  }
);


/* =========================
   INITIAL
========================= */

updateHUD();

</script>

</body>
</html>
